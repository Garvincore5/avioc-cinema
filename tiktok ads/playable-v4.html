<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09070c">
  <meta property="og:site_name" content="Avioc Cinema"><meta property="og:type" content="video.other"><meta property="og:image" content="https://aviocwatch.b-cdn.net/assets/social/default.jpg"><meta property="og:image:secure_url" content="https://aviocwatch.b-cdn.net/assets/social/default.jpg"><meta property="og:image:alt" content="Avioc Cinema"><meta property="og:title" content="Watch on Avioc Cinema"><meta property="og:description" content="Watch a clip and open the full movie on Avioc Cinema.">
  <title>Avioc Cinema Clip</title>
  <style>
    :root{color-scheme:dark;font:16px/1.45 Inter,Segoe UI,Arial,sans-serif;background:#09070c;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(900px 600px at 50% -12%,#392540 0,transparent 66%),#09070c}.wrap{width:100%;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:0}.stage{position:relative;overflow:hidden;background:#050407;box-shadow:0 24px 80px #000b}.player{display:block;width:100%;height:100%;object-fit:cover;background:#050407}.top{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 18px 70px;background:linear-gradient(180deg,rgba(5,4,8,.88),rgba(5,4,8,.48) 62%,transparent);pointer-events:none}.brand{font-weight:950;font-size:17px;letter-spacing:.04em;text-shadow:0 2px 10px #000}.brand i{font-style:normal;color:#ff9f24}.top h1{font-size:clamp(20px,5vw,29px);line-height:1.15;margin:18px 0 5px;text-shadow:0 2px 12px #000}.top p{font-size:12px;color:#f0e6f1;margin:0;text-shadow:0 2px 8px #000}.fullscreen{position:absolute;z-index:4;right:14px;top:calc(14px + env(safe-area-inset-top));border:1px solid #ffffff70;border-radius:999px;background:#17131dcc;color:#fff;padding:8px 11px;font-weight:800}.end-card{display:none;position:absolute;z-index:5;inset:0;overflow:auto;padding:24px 22px calc(24px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 15%,#44293c 0,#19131e 50%,#08070b 100%);text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:12px}.end-card.visible{display:flex}.end-poster{width:min(46%,230px);max-height:42%;object-fit:contain;border-radius:13px;box-shadow:0 14px 38px #0009}.end-brand{font-size:13px;font-weight:900;letter-spacing:.16em;color:#ffc56e}.end-title{font-size:clamp(22px,6vw,34px);line-height:1.12;margin:0}.end-copy{color:#c7bfcc;font-size:13px;margin:0 0 4px}.movie-cta{display:flex;align-items:center;justify-content:center;min-height:54px;width:min(100%,340px);padding:12px 18px;border:1px solid #ffffff80;border-radius:999px;background:linear-gradient(110deg,#ffc04e,#ff8a18);box-shadow:0 9px 30px #ff9f2470;color:#211409;text-decoration:none;font-weight:950;animation:floaty 1.8s ease-in-out infinite}.replay{border:0;background:transparent;color:#e3d8e8;text-decoration:underline;padding:8px;font:600 13px inherit}@keyframes floaty{0%,100%{translate:0 0;box-shadow:0 8px 22px #ff9f244c}50%{translate:0 -4px;box-shadow:0 13px 32px #ff9f2480}}.error{display:none;position:absolute;z-index:6;left:12px;right:12px;bottom:12px;padding:14px;border:1px solid #74404a;border-radius:12px;background:#301b22;color:#ffe4e7;font-size:13px}.error.visible{display:block}.direct{display:inline-block;color:#ffd18d;margin-top:8px}@media(prefers-reduced-motion:reduce){.movie-cta{animation:none}}
  </style>
</head><body><main class="wrap"><div class="stage" id="stage">
  <video class="player" id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  <div class="top"><div class="brand">AVIOC <i>●</i> CINEMA</div><h1 id="title">Watch this clip</h1><p>Watch the preview, then find the full movie.</p></div>
  <button class="fullscreen" id="fullscreen" type="button" aria-label="Enter fullscreen">⛶ Full screen</button>
  <section class="end-card" id="endCard" aria-live="polite"><div class="end-brand">AVIOC CINEMA</div><img class="end-poster" id="endPoster" alt="Movie poster"><h2 class="end-title" id="endTitle">Your movie</h2><p class="end-copy" id="endCopy">Continue watching the full movie on Avioc Cinema.</p><a class="movie-cta" id="movieCta" href="https://aviocwatch.b-cdn.net/" target="_blank" rel="noopener">Open this movie in Avioc ↗</a><button class="replay" id="replay" type="button">Replay preview</button></section>
  <div class="error" id="error">This video may not play in WhatsApp’s browser. Try opening it in Chrome, or use an MP4 source.<br><a class="direct" id="directVideo" target="_blank" rel="noopener">Open video directly</a></div>
</div></main>
<script>
(()=>{
  const params=new URLSearchParams(location.search),clip=params.get('clip'),to=params.get('to')||'https://aviocwatch.b-cdn.net/',title=params.get('title')||'Watch this clip',poster=params.get('poster')||'https://aviocwatch.b-cdn.net/assets/social/default.jpg',kind=params.get('kind')||'film';
  const safeUrl=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}};
  const video=safeUrl(clip),destination=safeUrl(to),posterUrl=safeUrl(poster),player=document.getElementById('player'),stage=document.getElementById('stage'),endCard=document.getElementById('endCard'),error=document.getElementById('error');
  const hasRange=params.has('start')||params.has('end');let segmentStart=Math.max(0,Number(params.get('start'))||0),segmentEnd=Math.max(0,Number(params.get('end'))||0),cardShown=false;
  const ratio=(params.get('ratio')||'9:16').split(':').map(n=>Math.max(1,Math.min(100,Number(n)||9))),aspect=ratio[0]/ratio[1];
  player.style.objectPosition=`${Math.max(0,Math.min(100,Number(params.get('fx'))||50))}% ${Math.max(0,Math.min(100,Number(params.get('fy'))||50))}%`;
  document.title=`${title} · Avioc Cinema`;document.getElementById('title').textContent=title;document.getElementById('endTitle').textContent=title;document.getElementById('endCopy').textContent=kind==='series'?'Open the series on Avioc Cinema to watch more episodes.':'Continue watching the full movie on Avioc Cinema.';
  if(destination)document.getElementById('movieCta').href=destination;if(posterUrl)document.getElementById('endPoster').src=posterUrl;
  function fit(){const maxW=Math.max(200,window.innerWidth),maxH=Math.max(240,window.innerHeight),w=Math.min(maxW,maxH*aspect);stage.style.width=Math.round(w)+'px';stage.style.height=Math.round(w/aspect)+'px'}fit();window.addEventListener('resize',fit);
  if(!video){error.classList.add('visible');return}document.getElementById('directVideo').href=video;player.src=video;
  function showEndCard(){if(cardShown)return;cardShown=true;player.pause();player.style.visibility='hidden';endCard.classList.add('visible')}
  player.addEventListener('loadedmetadata',()=>{if(!hasRange){segmentStart=0;segmentEnd=Math.min(30,player.duration)}else if(!segmentEnd||segmentEnd>player.duration)segmentEnd=player.duration;if(segmentEnd<=segmentStart){segmentStart=0;segmentEnd=Math.min(30,player.duration)}try{player.currentTime=segmentStart}catch(_){error.classList.add('visible')}},{once:true});
  let guarding=false;function guardRange(){if(segmentEnd>segmentStart&&player.currentTime>=segmentEnd){showEndCard();guarding=false;return}if(player.paused){guarding=false;return}requestAnimationFrame(guardRange)}
  player.addEventListener('play',()=>{if(cardShown)return;if(player.currentTime<segmentStart||player.currentTime>=segmentEnd)player.currentTime=segmentStart;if(!guarding){guarding=true;requestAnimationFrame(guardRange)}});
  player.addEventListener('timeupdate',()=>{if(segmentEnd>segmentStart&&player.currentTime>=segmentEnd)showEndCard()});player.addEventListener('ended',showEndCard);player.addEventListener('error',()=>error.classList.add('visible'));
  document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(stage.requestFullscreen)await stage.requestFullscreen();else if(player.webkitEnterFullscreen)player.webkitEnterFullscreen()}catch(_){}});
  document.getElementById('replay').addEventListener('click',async()=>{cardShown=false;endCard.classList.remove('visible');player.style.visibility='visible';player.currentTime=segmentStart;try{await player.play()}catch(_){}});
})();
</script></body></html>
