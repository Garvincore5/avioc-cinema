<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#09070c">
  <meta property="og:site_name" content="Avioc Cinema"><meta property="og:type" content="video.other"><meta property="og:image" content="https://aviocwatch.b-cdn.net/assets/social/default.jpg"><meta property="og:image:secure_url" content="https://aviocwatch.b-cdn.net/assets/social/default.jpg"><meta property="og:image:alt" content="Avioc Cinema"><meta property="og:title" content="Watch on Avioc Cinema"><meta property="og:description" content="Play this clip and discover more on Avioc Cinema.">
  <title>Watch on Avioc Cinema</title>
  <style>
    :root{color-scheme:dark;font:16px/1.45 Inter,Segoe UI,Arial,sans-serif;background:#09070c;color:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;background:radial-gradient(900px 600px at 50% -12%,#392540 0,transparent 66%),#09070c}.wrap{width:100%;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:12px}.card{width:100%;display:grid;place-items:center}.stage{position:relative;overflow:hidden;border:1px solid #4b3b50;border-radius:22px;background:#050407;box-shadow:0 25px 80px #000b}.stage video{display:block;width:100%;height:100%;object-fit:cover;background:#050407}.top-overlay{position:absolute;z-index:2;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 18px 65px;background:linear-gradient(180deg,rgba(5,4,8,.9),rgba(5,4,8,.5) 60%,transparent);pointer-events:none}.brand{font-weight:950;font-size:17px;letter-spacing:.04em;text-shadow:0 2px 10px #000}.brand i{font-style:normal;color:#ff9f24}.top-overlay h1{font-size:clamp(20px,5vw,29px);line-height:1.15;margin:17px 0 5px;text-shadow:0 2px 12px #000}.sub{font-size:12px;color:#f0e6f1;margin:0;text-shadow:0 2px 8px #000}.overlay-actions{position:absolute;z-index:5;top:calc(14px + env(safe-area-inset-top));right:14px;display:flex;gap:7px}.overlay-actions button{border:1px solid #ffffff70;border-radius:999px;background:#17131dcc;color:#fff;padding:8px 10px;font-weight:800}.cta{position:absolute;z-index:4;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;width:min(84%,340px);min-height:54px;display:flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid #ffffff80;border-radius:999px;background:linear-gradient(110deg,#ffc04e,#ff8a18);box-shadow:0 9px 30px #ff9f2470;color:#211409;text-decoration:none;text-align:center;font-weight:950;animation:floaty 1.8s ease-in-out infinite}.cta:active{filter:brightness(1.1)}@keyframes floaty{0%,100%{translate:-50% 0;box-shadow:0 8px 22px #ff9f244c}50%{translate:-50% -5px;box-shadow:0 13px 32px #ff9f2480}}.error{display:none;position:absolute;z-index:6;left:12px;right:12px;bottom:12px;padding:14px;border:1px solid #74404a;border-radius:12px;background:#301b22;color:#ffe4e7;font-size:13px}.error.visible{display:block}.direct{display:inline-block;color:#ffd18d;margin-top:8px}.hint{position:fixed;bottom:max(4px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#a69baa;font-size:10px;pointer-events:none}@media(prefers-reduced-motion:reduce){.cta{animation:none}}
  </style>
</head><body><main class="wrap"><section class="card"><div class="stage" id="stage">
  <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
  <div class="top-overlay"><div class="brand">AVIOC <i>●</i> CINEMA</div><h1 id="title">Watch this clip</h1><p class="sub">Play the moment. Discover what comes next.</p></div>
  <div class="overlay-actions"><button id="pip" type="button" title="Picture in picture">▣ PiP</button><button id="fullscreen" type="button" title="Fullscreen">⛶</button></div>
  <a class="cta" id="openSite" href="https://aviocwatch.b-cdn.net/" target="_blank" rel="noopener">Open Avioc Cinema ↗</a>
  <div class="error" id="error">This video may not be supported in WhatsApp’s browser. Try Chrome or use an MP4 source.<br><a class="direct" id="directVideo" target="_blank" rel="noopener">Open video directly</a></div>
</div></section><div class="hint">The PiP button floats the video when your browser supports it.</div></main>
<script>
(()=>{
  const params=new URLSearchParams(location.search),clip=params.get('clip'),to=params.get('to')||'https://aviocwatch.b-cdn.net/',title=params.get('title')||'Watch this clip';
  const safeUrl=value=>{try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}};
  const video=safeUrl(clip),destination=safeUrl(to),player=document.getElementById('player'),stage=document.getElementById('stage');
  const hasRange=params.has('start')||params.has('end');let segmentStart=Math.max(0,Number(params.get('start'))||0),segmentEnd=Math.max(0,Number(params.get('end'))||0);
  const ratio=(params.get('ratio')||'9:16').split(':').map(n=>Math.max(1,Math.min(100,Number(n)||9))),aspect=ratio[0]/ratio[1];
  player.style.objectPosition=`${Math.max(0,Math.min(100,Number(params.get('fx'))||50))}% ${Math.max(0,Math.min(100,Number(params.get('fy'))||50))}%`;
  document.title=`${title} · Avioc Cinema`;document.getElementById('title').textContent=title;
  if(destination)document.getElementById('openSite').href=destination;
  function fit(){const maxW=Math.max(200,window.innerWidth-24),maxH=Math.max(240,window.innerHeight-24),w=Math.min(maxW,520,maxH*aspect);stage.style.width=Math.round(w)+'px';stage.style.height=Math.round(w/aspect)+'px'}
  fit();window.addEventListener('resize',fit);
  const error=document.getElementById('error');
  if(!video){error.classList.add('visible');return}
  document.getElementById('directVideo').href=video;
  const media=new URL(video);if(segmentEnd>segmentStart)media.hash='t='+segmentStart+','+segmentEnd;player.src=media.href;
  player.addEventListener('loadedmetadata',()=>{
    if(!hasRange){segmentStart=0;segmentEnd=Math.min(30,player.duration)}else if(!segmentEnd||segmentEnd>player.duration)segmentEnd=player.duration;
    if(segmentEnd<=segmentStart){segmentStart=0;segmentEnd=Math.min(30,player.duration)}
    try{player.currentTime=segmentStart}catch(_){error.classList.add('visible')}
  },{once:true});
  let guarding=false;
  function guardRange(){if(segmentEnd>segmentStart&&player.currentTime>=segmentEnd){player.pause();try{player.currentTime=segmentEnd}catch(_){}guarding=false;return}if(player.paused){guarding=false;return}requestAnimationFrame(guardRange)}
  player.addEventListener('play',()=>{if(player.currentTime<segmentStart||player.currentTime>=segmentEnd)player.currentTime=segmentStart;if(!guarding){guarding=true;requestAnimationFrame(guardRange)}});
  player.addEventListener('timeupdate',()=>{if(segmentEnd>segmentStart&&player.currentTime>=segmentEnd){player.pause();player.currentTime=segmentEnd}});
  player.addEventListener('seeking',()=>{if(segmentEnd>segmentStart){if(player.currentTime<segmentStart)player.currentTime=segmentStart;else if(player.currentTime>segmentEnd)player.currentTime=segmentEnd}});
  player.addEventListener('error',()=>error.classList.add('visible'));
  document.getElementById('pip').addEventListener('click',async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else if(player.requestPictureInPicture)await player.requestPictureInPicture();else{error.textContent='Picture in picture is not supported in this browser. Use the expand button instead.';error.classList.add('visible')}}catch(_){error.textContent='Picture in picture is unavailable in this WhatsApp browser. Try Chrome.';error.classList.add('visible')}});
  document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(stage.requestFullscreen)await stage.requestFullscreen();else if(player.webkitEnterFullscreen)player.webkitEnterFullscreen()}catch(_){}});
})();
</script></body></html>
