name: Deploy Avioc Apps Store page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - manifest.json
      - sw.js
      - favicon.svg
      - icon-192.png
      - icon-512.png
      - assets/icons/avioc-apps-192.png
      - assets/icons/avioc-apps-512.png
      - .github/workflows/deploy-app-store.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-store:
    name: Publish Avioc Apps Store page to BunnyCDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload store page
        shell: bash
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f index.html || { echo "index.html is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/index.html"
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/apps.html"
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/apps-ota.html"
          echo "Avioc Apps Store page published to web and standalone OTA addresses."

      - name: Upload store icons and manifest
        shell: bash
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          for file in manifest.json sw.js favicon.svg icon-192.png icon-512.png assets/icons/avioc-apps-192.png assets/icons/avioc-apps-512.png; do
            test -f "$file" || { echo "$file is missing"; exit 1; }
            case "$file" in
              manifest.json) content_type="application/manifest+json; charset=utf-8" ;;
              sw.js) content_type="application/javascript; charset=utf-8" ;;
              favicon.svg) content_type="image/svg+xml" ;;
              *.png) content_type="image/png" ;;
            esac
            curl --fail --show-error --silent -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
              -H "Content-Type: $content_type" \
              -H "Cache-Control: no-cache, no-store, must-revalidate" \
              --data-binary @"$file" \
              "https://storage.bunnycdn.com/aviocwatch/$file"
          done
          echo "Avioc Apps Store icons and manifest published."
