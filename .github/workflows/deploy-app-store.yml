name: Deploy Avioc Apps Store page

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-app-store.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-store:
    name: Publish Avioc Apps Store page to BunnyCDN
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Upload store page
        shell: bash
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f index.html || { echo "index.html is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/index.html"
          echo "Avioc Apps Store page published to BunnyCDN."
