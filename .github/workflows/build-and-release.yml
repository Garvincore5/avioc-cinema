name: Build Avioc Cinema Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - cinema.html
      - api-config.js
      - 'new body/catalog-data.json'
      - scripts/prepare-android-cinema.js
      - scripts/prepare-android-release.js
      - scripts/android-media3/**
      - electron/main.js
      - capacitor.config.json
      - .github/workflows/build-and-release.yml
      - .github/workflows/deploy-cinema-ota.yml
      - index.html
      - manifest.json
      - favicon.svg
      - icon-192.png
      - icon-512.png
      - .github/workflows/deploy-app-store.yml
      - .github/workflows/publish-apk-alias.yml
      - scripts/prepare-app-store-page.js
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.27'

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP BUILD (32-bit & 64-bit)
  # ============================================================================
  build-windows:
    name: 🪟 Windows desktop (32-bit & 64-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Avioc Apps icons
        run: node scripts/generate-apps-icon.js

      - name: Set store links to this release
        run: node scripts/prepare-app-store-page.js

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Build Windows executables (Avioc Cinema & Avioc Apps)
        run: |
          npx electron-builder --config electron-builder.json --win --ia32 --x64 --publish never
          npx electron-builder --config electron-builder-apps.json --win --ia32 --x64 --publish never

      - name: Collect and Name Windows Outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-binaries" -Force
          Get-ChildItem -Path "dist-desktop" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-binaries/$($_.Name)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-binaries/*.exe
          retention-days: 14

  build-core-sorter-windows:
    name: Core Sorter portable Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package builder and generate app icon
        run: |
          python -m pip install --upgrade pip pyinstaller pillow
          python scripts/generate-core-sorter-icon.py
      - name: Build portable Core Sorter
        run: pyinstaller --noconfirm --clean --onefile --windowed --name CoreSorter --icon assets/icons/core-sorter.ico store-apps/core-sorter/src/sorter.py
      - name: Collect Core Sorter release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-binaries -Force | Out-Null
          Copy-Item dist/CoreSorter.exe release-binaries/Core-Sorter-Windows-x64-v1.0.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: core-sorter-windows-binary
          path: release-binaries/*.exe
          retention-days: 14

  build-corecut-windows:
    name: CoreCut Windows video editor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor plugins
        run: npm ci
      - name: Install and build CoreCut
        working-directory: store-apps/corecut/src
        run: |
          npm ci
          npm run dist:win
      - name: Collect CoreCut Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-binaries -Force | Out-Null
          Copy-Item store-apps/corecut/src/release/CoreCut.exe release-binaries/CoreCut-Windows-x64-v0.5.0.exe
          Copy-Item store-apps/corecut/src/release/CoreCut-Setup.exe release-binaries/CoreCut-Setup-Windows-x64-v0.5.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: corecut-windows-binaries
          path: release-binaries/*.exe
          retention-days: 14

  build-corecut-macos:
    name: CoreCut macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor plugins
        run: npm ci
      - name: Install and package CoreCut
        working-directory: store-apps/corecut/src
        run: |
          npm ci
          npm run build
          npm run build:electron
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Collect macOS package
        run: |
          mkdir -p release-binaries
          cp store-apps/corecut/src/release/*.dmg release-binaries/CoreCut-Mac-${{ matrix.arch }}-v0.5.0.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: corecut-macos-${{ matrix.arch }}
          path: release-binaries/*.dmg
          retention-days: 14

  build-corecut-linux:
    name: CoreCut Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor plugins
        run: npm ci
      - name: Install and package CoreCut
        working-directory: store-apps/corecut/src
        run: |
          npm ci
          npm run build
          npm run build:electron
          npx electron-builder --linux AppImage --${{ matrix.arch }} --publish never
      - name: Collect Linux package
        run: |
          mkdir -p release-binaries
          cp store-apps/corecut/src/release/*.AppImage release-binaries/CoreCut-Linux-${{ matrix.arch }}-v0.5.0.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: corecut-linux-${{ matrix.arch }}
          path: release-binaries/*.AppImage
          retention-days: 14

  build-corecut-web:
    name: CoreCut browser edition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor plugins
        run: npm ci
      - name: Build CoreCut browser edition
        working-directory: store-apps/corecut/src
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: corecut-web-files
          path: store-apps/corecut/src/dist/**
          retention-days: 14

  build-corecut-android:
    name: Signed CoreCut Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor and Android dependencies
        run: npm ci
      - name: Build the CoreCut mobile editor
        working-directory: store-apps/corecut/src
        run: |
          npm ci
          npm run build
      - name: Prepare bundled Android editor files
        run: |
          mkdir -p store-apps/corecut/android/www
          cp -R store-apps/corecut/src/dist/. store-apps/corecut/android/www/
          node scripts/prepare-android-corecut.js
      - name: Create and sync native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure app identity and release version
        run: node scripts/configure-store-android-release.js
        env:
          STORE_ANDROID_APP_ID: com.avioc.corecut
          STORE_ANDROID_APP_NAME: CoreCut
          STORE_ANDROID_ICON_FILE: store-apps/corecut/android-res/ic_corecut.xml
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build and verify signed CoreCut APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p ../release-binaries
          cp "$apk" ../release-binaries/CoreCut-Android-v1.0.0.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: corecut-android-binaries
          path: release-binaries/*.apk
          retention-days: 14

  build-simmer-android:
    name: Signed Simmer Android Photo Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install shared Capacitor and Android dependencies
        run: npm ci
      - name: Build the bundled Simmer photo studio
        working-directory: store-apps/simmer/src
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: simmer-web-files
          path: store-apps/simmer/src/dist/**
          retention-days: 14
      - name: Prepare bundled Android photo editor
        run: |
          mkdir -p store-apps/simmer/android/www
          cp -R store-apps/simmer/src/dist/. store-apps/simmer/android/www/
          node scripts/prepare-android-simmer.js
      - name: Create and sync native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure app identity and release version
        run: node scripts/configure-store-android-release.js
        env:
          STORE_ANDROID_APP_ID: com.avioc.simmer
          STORE_ANDROID_APP_NAME: Simmer Photo Studio
          STORE_ANDROID_ICON_FILE: store-apps/simmer/android-res/ic_simmer.xml
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build and verify signed Simmer APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p ../release-binaries
          cp "$apk" ../release-binaries/Simmer-Android-v1.0.0.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: simmer-android-binaries
          path: release-binaries/*.apk
          retention-days: 14

  build-quik-android:
    name: Signed QU!K Android Video Editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor and Android dependencies
        run: npm ci
      - name: Build the QU!K browser edition
        working-directory: store-apps/quik/src
        run: |
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: quik-web-files
          path: store-apps/quik/src/dist/**
          retention-days: 14
      - name: Prepare bundled Android edition
        run: |
          mkdir -p store-apps/quik/android/www
          cp -R store-apps/quik/src/dist/. store-apps/quik/android/www/
          node scripts/prepare-android-quik.js
          npx cap add android
          npx cap sync android
          node scripts/configure-store-android-release.js
        env:
          STORE_ANDROID_APP_ID: com.avioc.quik
          STORE_ANDROID_APP_NAME: QU!K Video Clips
          STORE_ANDROID_ICON_FILE: store-apps/quik/android-res/ic_quik.xml
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.0
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build and verify signed QU!K APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose "$apk"
          mkdir -p ../release-binaries
          cp "$apk" ../release-binaries/QUiK-Android-v1.0.0.apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: quik-android-binaries
          path: release-binaries/*.apk
          retention-days: 14

  # Avioc Apps has its own signed Android package and is separate from Cinema.
  build-android-apps:
    name: 🤖 Signed Avioc Apps Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm install
      - name: Generate Avioc Apps icons and configure the Android app
        run: node scripts/prepare-android-apps.js
      - name: Build hosted store files
        run: node scripts/build-hosting.js
      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Prepare Android release version
        run: node scripts/prepare-android-apps-release.js
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed Avioc Apps APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify and name signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK" && test -f "$APK"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$APK"
          mkdir -p release-binaries
          version=$(node -p "require('./package.json').version")
          cp "$APK" "release-binaries/Avioc-Apps-Android-v${version}.apk"
      - name: Upload signed Avioc Apps APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apps-binary
          path: release-binaries/*.apk
          retention-days: 14

  build-clearview-android:
    name: Signed Clearview Browser Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/avioc-release-key.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed Clearview APK
        working-directory: store-apps/clearview/android
        run: gradle assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLEARVIEW_VERSION_CODE: ${{ github.run_number }}
          CLEARVIEW_VERSION_NAME: 1.1.1
      - name: Verify APK and package source notices
        shell: bash
        run: |
          set -euo pipefail
          apk="store-apps/clearview/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          mkdir -p release-binaries
          cp "$apk" release-binaries/Clearview-Android-v1.1.1.apk
          zip -qr release-binaries/Clearview-Android-source-v1.1.1.zip store-apps/clearview
      - uses: actions/upload-artifact@v4
        with:
          name: clearview-android-binaries
          path: release-binaries/*
          retention-days: 14

  build-family-hub-android:
    name: Signed Our Family Hub Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies and configure the offline app
        run: |
          npm install
          node scripts/prepare-android-family-hub.js
      - name: Create and sync native Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure app identity and release version
        run: node scripts/configure-store-android-release.js
        env:
