  # ============================================================================
  # 2. ANDROID RELEASE APK
  # ============================================================================
  build-android:
    name: 🤖 Avioc Cinema Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Set Android app entry to Avioc Cinema
        run: node scripts/prepare-android-cinema.js

      - name: Prepare persistent Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD GitHub secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Initialize and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android update version and store verification
        run: node scripts/prepare-android-release.js
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

      - name: Build signed Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed APK and prepare release output
        run: |
          mkdir -p release-binaries
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            echo "Verifying the signed release APK..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            test -n "$APKSIGNER" || { echo "Android apksigner not found"; exit 1; }
            "$APKSIGNER" verify --verbose "$RAW_APK"
            cp "$RAW_APK" release-binaries/Avioc-Cinema.apk
            echo "Successfully prepared release-binaries/Avioc-Cinema.apk"
          else
            echo "No APK found in build outputs!"
            exit 1
          fi

      - name: Generate Android app link verification file
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/avioc-release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          test -n "$FINGERPRINT" || { echo "Could not read Android signing certificate fingerprint"; exit 1; }
          mkdir -p release-binaries
          cat > release-binaries/assetlinks.json <<EOF
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.avioc.cinema","sha256_cert_fingerprints":["$FINGERPRINT"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.avioc.apps","sha256_cert_fingerprints":["$FINGERPRINT"]}}]
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-binaries/*
          retention-days: 14

