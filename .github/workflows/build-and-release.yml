name: Build Avioc Cinema Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP BUILD (32-bit & 64-bit)
  # ============================================================================
  build-windows:
    name: 🪟 Windows desktop (32-bit & 64-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Build Windows executables (Avioc Cinema & Avioc Apps)
        run: |
          npx electron-builder --config electron-builder.json --win --ia32 --x64 --publish never
          npx electron-builder --config electron-builder-apps.json --win --ia32 --x64 --publish never

      - name: Collect and Name Windows Outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-binaries" -Force
          Get-ChildItem -Path "dist-desktop" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-binaries/$($_.Name)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-binaries/*.exe
          retention-days: 14

  # ============================================================================
  # 2. ANDROID RELEASE APK
  # ============================================================================
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Prepare persistent Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD GitHub secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Initialize and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build signed Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed APK and prepare release output
        run: |
          mkdir -p release-binaries
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            echo "Verifying the signed release APK..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            test -n "$APKSIGNER" || { echo "Android apksigner not found"; exit 1; }
            "$APKSIGNER" verify --verbose "$RAW_APK"
            cp "$RAW_APK" release-binaries/Avioc-Cinema.apk
            echo "Successfully prepared release-binaries/Avioc-Cinema.apk"
          else
            echo "No APK found in build outputs!"
            exit 1
          fi

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-binaries/*.apk
          retention-days: 14

  # ============================================================================
  # 3. MACOS BUILD (macOS 10.13+ Intel & Apple Silicon)
  # ============================================================================
  build-macos:
    name: 🍎 macOS (macOS 10.13+ Universal DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Build macOS DMG (Intel & Apple Silicon)
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --mac dmg --publish never

      - name: Prepare macOS DMG Output
        run: |
          mkdir -p release-binaries
          find dist-desktop -name "*.dmg" -exec cp {} release-binaries/Avioc-Cinema-Mac.dmg \;

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: release-binaries/*.dmg
          retention-days: 14

  # ============================================================================
  # 4. IPHONE / IPAD HOME-SCREEN WEB CLIP PROFILE (not a native iOS app)
  # ============================================================================
  build-ios-webclip:
    name: 📱 iPhone / iPad home-screen website shortcut
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Generate iPhone/iPad website shortcut profile
        run: node scripts/generate-ios-profile.js

      - name: Upload iPhone/iPad Web Clip profile
        uses: actions/upload-artifact@v4
        with:
          name: ios-webclip-profile
          path: release-binaries/Avioc-Cinema.mobileconfig
          retention-days: 14

  # ============================================================================
  # 5. PUBLISH ALL-DEVICE RELEASE
  # ============================================================================
  publish-release:
    name: 🚀 Publish Universal Compatibility Release
    needs: [build-windows, build-android, build-macos, build-ios-webclip]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.build-windows.result == 'success' && needs.build-android.result == 'success' && needs.build-macos.result == 'success' && needs.build-ios-webclip.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: final-release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: final-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: final-release

      - name: Download iPhone/iPad Web Clip Profile
        uses: actions/download-artifact@v4
        with:
          name: ios-webclip-profile
          path: final-release

      - name: List Release Files
        run: |
          echo "All release packages prepared:"
          ls -la final-release/ || true

      - name: Upload All Built Apps Directly to BunnyCDN
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -n "$(find final-release -maxdepth 1 -type f -print -quit)" || { echo "No release artifacts were downloaded"; exit 1; }
          STORAGE="https://storage.bunnycdn.com/aviocwatch/avioc%20app/avioc%20cinema"
          echo "Uploading all built apps to BunnyCDN..."
          for file in final-release/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              echo "Uploading $fname to BunnyCDN..."
              curl --fail --show-error --silent -X PUT -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" -H "Content-Type: application/octet-stream" --data-binary @"$file" "$STORAGE/$fname"
              echo " -> [OK] Uploaded $fname"
            fi
          done
          echo "All built apps are live on BunnyCDN!"
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }}
          name: Avioc Cinema App Release (${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }})
          body: |
            # 🎬 Avioc Cinema — App Release

            Release packages built by the Avioc Cinema workflow. Check each device's compatibility before installing.

            ---

            ### 📦 Download Links by Device:

            #### 🤖 Android
            - **All Phones, Tablets & Android TV**: [`Avioc-Cinema.apk`](Avioc-Cinema.apk)
              *(Compatible with low-RAM phones, Tecno, Itel, Infinix, Samsung Galaxy, Huawei, Xiaomi, etc.)*

            #### 🪟 Windows (unsigned; Windows may show a publisher warning)
            - **Windows 32-bit (Old laptops & PCs)**: [`Avioc-Cinema-Setup-ia32.exe`](Avioc-Cinema-Setup-ia32.exe)
            - **Windows 64-bit (Standard PCs)**: [`Avioc-Cinema-Setup-x64.exe`](Avioc-Cinema-Setup-x64.exe)

            #### 📱 iPhone & iPad
            - **Home-screen website shortcut profile**: [`Avioc-Cinema.mobileconfig`](Avioc-Cinema.mobileconfig)
              *(This adds a shortcut to the hosted website; it is not a native iOS app or IPA.)*

            #### 🍎 Mac (unsigned; macOS may show an unidentified developer warning)
            - **Mac Installer (Universal for Apple Silicon M1-M4 & Intel)**: [`Avioc-Cinema-Mac.dmg`](Avioc-Cinema-Mac.dmg)

            ---
            *Windows and Mac builds are unsigned. Android builds use the persistent signing key configured in GitHub Actions Secrets.*
          files: final-release/*
