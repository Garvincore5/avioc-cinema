          upload() {
            local source="$1" destination="$2" content_type="$3"
            test -s "$source" || { echo "Missing OTA file: $source"; exit 1; }
            curl --fail --show-error --silent -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
