      - name: Download Avioc Apps Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-apps-binaries
          path: final-release
      - name: Download Avioc Apps iPhone/iPad shortcut
        uses: actions/download-artifact@v4
        with:
          name: ios-apps-profile
          path: final-release

      - name: List Release Files
        run: |
          echo "All release packages prepared:"
          ls -la final-release/ || true

      - name: Upload All Built Apps Directly to BunnyCDN
        shell: bash
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -n "$(find final-release -maxdepth 1 -type f -print -quit)" || { echo "No release artifacts were downloaded"; exit 1; }
          APP_VERSION=$(node -p "require('./package.json').version")
          STORAGE="https://storage.bunnycdn.com/aviocwatch/avioc%20app/avioc%20cinema"
          echo "Uploading all built apps to BunnyCDN..."
          for file in final-release/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              if [ "$fname" = "assetlinks.json" ]; then
                continue
              fi
              content_type="application/octet-stream"
              if [[ "$fname" == *.apk ]]; then
                content_type="application/vnd.android.package-archive"
              elif [[ "$fname" == *.mobileconfig ]]; then
                content_type="application/x-apple-aspen-config"
              elif [[ "$fname" == *.dmg ]]; then
                content_type="application/x-apple-diskimage"
              elif [[ "$fname" == *.AppImage ]]; then
                content_type="application/vnd.appimage"
              fi
              echo "Uploading $fname to BunnyCDN..."
              curl --fail --show-error --silent -X PUT -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" -H "Content-Type: $content_type" --data-binary @"$file" "$STORAGE/$fname"
              echo " -> [OK] Uploaded $fname"
              if [[ "$fname" =~ ^Avioc-Apps-Setup-(x64|ia32)\.exe$ ]]; then
                arch="${BASH_REMATCH[1]}"
                versioned_name="Avioc-Apps-Setup-v${APP_VERSION}-${arch}.exe"
                echo "Publishing versioned standalone installer $versioned_name..."
                curl --fail --show-error --silent -X PUT \
                  -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$file" \
                  "$STORAGE/$versioned_name"
                echo " -> [OK] Uploaded $versioned_name"
              fi
            fi
          done

      - name: Publish CoreCut browser edition
        shell: bash
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -s corecut-web/index.html
          while IFS= read -r -d '' file; do
            relative="${file#corecut-web/}"
            case "$file" in
              *.html) content_type='text/html; charset=utf-8'; cache='no-cache, no-store, must-revalidate' ;;
              *.js) content_type='text/javascript; charset=utf-8'; cache='public, max-age=31536000, immutable' ;;
              *.css) content_type='text/css; charset=utf-8'; cache='public, max-age=31536000, immutable' ;;
              *.svg) content_type='image/svg+xml'; cache='public, max-age=31536000, immutable' ;;
              *.webmanifest) content_type='application/manifest+json; charset=utf-8'; cache='no-cache, no-store, must-revalidate' ;;
              *.wasm) content_type='application/wasm'; cache='public, max-age=31536000, immutable' ;;
              *.png) content_type='image/png'; cache='public, max-age=31536000, immutable' ;;
              *) content_type='application/octet-stream'; cache='public, max-age=31536000, immutable' ;;
            esac
            curl --fail --show-error --silent -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
              -H "Content-Type: $content_type" \
              -H "Cache-Control: $cache" \
              --data-binary "@$file" \
              "https://storage.bunnycdn.com/aviocwatch/corecut/$relative"
          done < <(find corecut-web -type f -print0)
          echo "All built apps are live on BunnyCDN!"

