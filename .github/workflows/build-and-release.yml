name: Build Avioc Cinema Apps

on:
  push:
    branches:
      - main
    paths-ignore:
      - cinema.html
      - api-config.js
      - 'new body/catalog-data.json'
      - scripts/prepare-android-cinema.js
      - scripts/prepare-android-release.js
      - scripts/android-media3/**
      - electron/main.js
      - capacitor.config.json
      - .github/workflows/build-and-release.yml
      - .github/workflows/deploy-cinema-ota.yml
      - index.html
      - manifest.json
      - favicon.svg
      - icon-192.png
      - icon-512.png
      - .github/workflows/deploy-app-store.yml
      - .github/workflows/publish-apk-alias.yml
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.16'

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. WINDOWS DESKTOP BUILD (32-bit & 64-bit)
  # ============================================================================
  build-windows:
    name: 🪟 Windows desktop (32-bit & 64-bit)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Avioc Apps icons
        run: node scripts/generate-apps-icon.js

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Build Windows executables (Avioc Cinema & Avioc Apps)
        run: |
          npx electron-builder --config electron-builder.json --win --ia32 --x64 --publish never
          npx electron-builder --config electron-builder-apps.json --win --ia32 --x64 --publish never

      - name: Collect and Name Windows Outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-binaries" -Force
          Get-ChildItem -Path "dist-desktop" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "release-binaries/$($_.Name)"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: release-binaries/*.exe
          retention-days: 14

  # Avioc Apps has its own signed Android package and is separate from Cinema.
  build-android-apps:
    name: 🤖 Signed Avioc Apps Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Dependencies
        run: npm install
      - name: Generate Avioc Apps icons and configure the Android app
        run: node scripts/prepare-android-apps.js
      - name: Build hosted store files
        run: node scripts/build-hosting.js
      - name: Add and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Prepare Android release version
        run: node scripts/prepare-android-apps-release.js
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
      - name: Restore Android signing key from GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 GitHub secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD GitHub secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS GitHub secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD GitHub secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build signed Avioc Apps APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Verify and name signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK" && test -f "$APK"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose "$APK"
          mkdir -p release-binaries
          version=$(node -p "require('./package.json').version")
          cp "$APK" "release-binaries/Avioc-Apps-Android-v${version}.apk"
      - name: Upload signed Avioc Apps APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apps-binary
          path: release-binaries/*.apk
          retention-days: 14

  build-macos-apps:
    name: 🍎 Avioc Apps for macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: node scripts/generate-apps-icon.js
      - run: node scripts/build-hosting.js
      - name: Build universal Avioc Apps DMG
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --config electron-builder-apps.json --mac dmg --publish never
      - name: Name Avioc Apps DMG
        run: |
          mkdir -p release-binaries
          version=$(node -p "require('./package.json').version")
          cp dist-desktop/*.dmg "release-binaries/Avioc-Apps-Mac-v${version}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-apps-binary
          path: release-binaries/*.dmg
          retention-days: 14

  build-linux-apps:
    name: 🐧 Avioc Apps for Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm install
      - run: node scripts/generate-apps-icon.js
      - run: node scripts/build-hosting.js
      - name: Build x64 and ARM64 AppImage packages
        run: npx electron-builder --config electron-builder-apps.json --linux AppImage --x64 --arm64 --publish never
      - name: Name Linux packages
        run: |
          set -euo pipefail
          mkdir -p release-binaries
          version="$(node -p "require('./package.json').version")"
          find dist-desktop -maxdepth 1 -type f -iname '*.appimage' -print0 | while IFS= read -r -d '' file; do
            image_name=$(basename "$file")
            case "$image_name" in
              *arm64*|*aarch64*|*armv8*) arch=arm64 ;;
              *x64*|*x86_64*|*amd64*) arch=x64 ;;
              *)
                image_info=$(file "$file")
                case "$image_info" in
                  *aarch64*|*ARM*) arch=arm64 ;;
                  *x86-64*|*x86_64*|*Intel\ 80386*) arch=x64 ;;
                  *) echo "Cannot identify AppImage architecture: $image_info"; exit 1 ;;
                esac
                ;;
            esac
            cp "$file" "release-binaries/Avioc-Apps-Linux-${arch}-v${version}.AppImage"
          done
          find dist-desktop -maxdepth 1 -type f -iname '*.appimage' -print
          for arch in x64 arm64; do
            test -s "release-binaries/Avioc-Apps-Linux-${arch}-v${version}.AppImage" || { echo "Missing Linux ${arch} AppImage"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-apps-binaries
          path: release-binaries/*.AppImage
          retention-days: 14

  build-ios-apps-profile:
    name: 📱 Avioc Apps iPhone/iPad Home Screen shortcut
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Avioc Apps web clip profile
        run: |
          node scripts/generate-apps-icon.js
          node scripts/generate-ios-apps-profile.js
      - uses: actions/upload-artifact@v4
        with:
          name: ios-apps-profile
          path: release-binaries/Avioc-Apps.mobileconfig
          retention-days: 14

  # ============================================================================
  # 2. ANDROID RELEASE APK
  # ============================================================================
  build-android:
    name: 🤖 Avioc Cinema Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Set Android app entry to Avioc Cinema
        run: node scripts/prepare-android-cinema.js

      - name: Prepare persistent Android signing key
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS GitHub secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD GitHub secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/avioc-release-key.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Initialize and sync Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android update version and store verification
        run: node scripts/prepare-android-release.js
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

      - name: Build signed Android release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/avioc-release-key.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify signed APK and prepare release output
        run: |
          mkdir -p release-binaries
          RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            echo "Verifying the signed release APK..."
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            test -n "$APKSIGNER" || { echo "Android apksigner not found"; exit 1; }
            "$APKSIGNER" verify --verbose "$RAW_APK"
            cp "$RAW_APK" release-binaries/Avioc-Cinema.apk
            echo "Successfully prepared release-binaries/Avioc-Cinema.apk"
          else
            echo "No APK found in build outputs!"
            exit 1
          fi

      - name: Generate Android app link verification file
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/avioc-release-key.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1)
          test -n "$FINGERPRINT" || { echo "Could not read Android signing certificate fingerprint"; exit 1; }
          mkdir -p release-binaries
          cat > release-binaries/assetlinks.json <<EOF
          [{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.avioc.cinema","sha256_cert_fingerprints":["$FINGERPRINT"]}},{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.avioc.apps","sha256_cert_fingerprints":["$FINGERPRINT"]}}]
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: release-binaries/*
          retention-days: 14

  # ============================================================================
  # 3. MACOS BUILD (macOS 10.13+ Intel & Apple Silicon)
  # ============================================================================
  build-macos:
    name: 🍎 macOS (macOS 10.13+ Universal DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Build macOS DMG (Intel & Apple Silicon)
        run: |
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          npx electron-builder --mac dmg --publish never

      - name: Prepare macOS DMG Output
        run: |
          mkdir -p release-binaries
          find dist-desktop -name "*.dmg" -exec cp {} release-binaries/Avioc-Cinema-Mac.dmg \;

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: release-binaries/*.dmg
          retention-days: 14

  # ============================================================================
  # 4. IPHONE / IPAD HOME-SCREEN WEB CLIP PROFILE (not a native iOS app)
  # ============================================================================
  build-ios-webclip:
    name: 📱 iPhone / iPad home-screen website shortcut
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Local Standalone Web Package
        run: node scripts/build-hosting.js

      - name: Generate iPhone/iPad website shortcut profile
        run: node scripts/generate-ios-profile.js

      - name: Upload iPhone/iPad Web Clip profile
        uses: actions/upload-artifact@v4
        with:
          name: ios-webclip-profile
          path: release-binaries/Avioc-Cinema.mobileconfig
          retention-days: 14

  # ============================================================================
  # 5. PUBLISH ALL-DEVICE RELEASE
  # ============================================================================
  publish-release:
    name: 🚀 Publish Universal Compatibility Release
    needs: [build-windows, build-android, build-macos, build-ios-webclip, build-android-apps, build-macos-apps, build-linux-apps, build-ios-apps-profile]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && needs.build-windows.result == 'success' && needs.build-android.result == 'success' && needs.build-macos.result == 'success' && needs.build-ios-webclip.result == 'success' && needs.build-android-apps.result == 'success' && needs.build-macos-apps.result == 'success' && needs.build-linux-apps.result == 'success' && needs.build-ios-apps-profile.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout source for live cinema page
        uses: actions/checkout@v4

      - name: Prepare OTA Cinema web pages
        run: |
          npm install
          node scripts/build-hosting.js
          node scripts/prepare-android-cinema.js

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: final-release

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-binaries
          path: final-release

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: final-release

      - name: Download iPhone/iPad Web Clip Profile
        uses: actions/download-artifact@v4
        with:
          name: ios-webclip-profile
          path: final-release
      - name: Download Avioc Apps Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apps-binary
          path: final-release
      - name: Download Avioc Apps Mac DMG
        uses: actions/download-artifact@v4
        with:
          name: macos-apps-binary
          path: final-release
      - name: Download Avioc Apps Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-apps-binaries
          path: final-release
      - name: Download Avioc Apps iPhone/iPad shortcut
        uses: actions/download-artifact@v4
        with:
          name: ios-apps-profile
          path: final-release

      - name: List Release Files
        run: |
          echo "All release packages prepared:"
          ls -la final-release/ || true

      - name: Upload All Built Apps Directly to BunnyCDN
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -n "$(find final-release -maxdepth 1 -type f -print -quit)" || { echo "No release artifacts were downloaded"; exit 1; }
          APP_VERSION=$(node -p "require('./package.json').version")
          STORAGE="https://storage.bunnycdn.com/aviocwatch/avioc%20app/avioc%20cinema"
          echo "Uploading all built apps to BunnyCDN..."
          for file in final-release/*; do
            if [ -f "$file" ]; then
              fname=$(basename "$file")
              if [ "$fname" = "assetlinks.json" ]; then
                continue
              fi
              content_type="application/octet-stream"
              if [[ "$fname" == *.apk ]]; then
                content_type="application/vnd.android.package-archive"
              elif [[ "$fname" == *.mobileconfig ]]; then
                content_type="application/x-apple-aspen-config"
              elif [[ "$fname" == *.dmg ]]; then
                content_type="application/x-apple-diskimage"
              elif [[ "$fname" == *.AppImage ]]; then
                content_type="application/vnd.appimage"
              fi
              echo "Uploading $fname to BunnyCDN..."
              curl --fail --show-error --silent -X PUT -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" -H "Content-Type: $content_type" --data-binary @"$file" "$STORAGE/$fname"
              echo " -> [OK] Uploaded $fname"
              if [[ "$fname" =~ ^Avioc-Apps-Setup-(x64|ia32)\.exe$ ]]; then
                arch="${BASH_REMATCH[1]}"
                versioned_name="Avioc-Apps-Setup-v${APP_VERSION}-${arch}.exe"
                echo "Publishing versioned standalone installer $versioned_name..."
                curl --fail --show-error --silent -X PUT \
                  -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
                  -H "Content-Type: application/octet-stream" \
                  --data-binary @"$file" \
                  "$STORAGE/$versioned_name"
                echo " -> [OK] Uploaded $versioned_name"
              fi
            fi
          done
          echo "All built apps are live on BunnyCDN!"
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish Android store verification file
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f final-release/assetlinks.json || { echo "Android assetlinks file is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @final-release/assetlinks.json \
            "https://storage.bunnycdn.com/aviocwatch/.well-known/assetlinks.json"
          echo "Android store install detection is now verified."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish customer cinema page to BunnyCDN
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f cinema.html || { echo "cinema.html is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @cinema.html \
            "https://storage.bunnycdn.com/aviocwatch/cinema.html"
          echo "Customer cinema page published to BunnyCDN."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish the OTA Cinema app page and its public data
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          upload() {
            local source="$1" destination="$2" content_type="$3"
            test -s "$source" || { echo "Missing OTA file: $source"; exit 1; }
            curl --fail --show-error --silent -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
              -H "Content-Type: $content_type" \
              -H "Cache-Control: no-cache, no-store, must-revalidate" \
              --data-binary @"$source" \
              "https://storage.bunnycdn.com/aviocwatch/$destination"
          }
          upload firebase-public/cinema-app.html cinema-app.html 'text/html; charset=utf-8'
          upload firebase-public/apps.html apps.html 'text/html; charset=utf-8'
          upload firebase-public/api-config.js api-config.js 'application/javascript; charset=utf-8'
          upload firebase-public/catalog-data.json catalog-data.json 'application/json; charset=utf-8'
          echo "OTA Cinema web page and configuration published."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish Avioc Apps store page to BunnyCDN
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f index.html || { echo "index.html is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/index.html"
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/apps-ota.html"
          APP_VERSION=$(node -p "require('./package.json').version")
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: text/html; charset=utf-8" \
            -H "Cache-Control: public, max-age=31536000, immutable" \
            --data-binary @index.html \
            "https://storage.bunnycdn.com/aviocwatch/apps-ota-v${APP_VERSION}.html"
          echo "Avioc Apps store page published to BunnyCDN."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish Avioc Apps PWA icons
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          for file in assets/icons/avioc-apps-192.png assets/icons/avioc-apps-512.png; do
            test -s "$file" || { echo "Missing Avioc Apps icon: $file"; exit 1; }
            curl --fail --show-error --silent -X PUT \
              -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
              -H "Content-Type: image/png" \
              -H "Cache-Control: public, max-age=31536000, immutable" \
              --data-binary @"$file" \
              "https://storage.bunnycdn.com/aviocwatch/$file"
          done
          echo "Avioc Apps PWA icons published."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Publish store install-detection manifest to BunnyCDN
        shell: bash
        run: |
          set -euo pipefail
          : "${BUNNY_STORAGE_ZONE_KEY:?Set the BUNNY_STORAGE_ZONE_KEY GitHub Actions secret}"
          test -f manifest.json || { echo "manifest.json is missing"; exit 1; }
          curl --fail --show-error --silent -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_ZONE_KEY" \
            -H "Content-Type: application/manifest+json; charset=utf-8" \
            -H "Cache-Control: no-cache, no-store, must-revalidate" \
            --data-binary @manifest.json \
            "https://storage.bunnycdn.com/aviocwatch/manifest.json"
          echo "Store manifest published."
        env:
          BUNNY_STORAGE_ZONE_KEY: ${{ secrets.BUNNY_STORAGE_ZONE_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }}
          name: Avioc Cinema App Release (${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }})
          body: |
            # 🎬 Avioc Cinema — App Release

            Release packages built by the Avioc Cinema workflow. Check each device's compatibility before installing.

            ---

            ### 🎬 Avioc Cinema

            #### 🤖 Android
            - **All Phones, Tablets & Android TV**: [`Avioc-Cinema.apk`](Avioc-Cinema.apk)

            - **Windows 32-bit**: [`Avioc-Cinema-Setup-ia32.exe`](Avioc-Cinema-Setup-ia32.exe) *(unsigned)*
            - **Windows 64-bit**: [`Avioc-Cinema-Setup-x64.exe`](Avioc-Cinema-Setup-x64.exe) *(unsigned)*
            - **Mac**: [`Avioc-Cinema-Mac.dmg`](Avioc-Cinema-Mac.dmg) *(unsigned)*

            #### 📱 iPhone & iPad
            - **Home-screen website shortcut profile**: [`Avioc-Cinema.mobileconfig`](Avioc-Cinema.mobileconfig)
              *(This adds a shortcut to the hosted website; it is not a native iOS app or IPA.)*

            ### 🛍️ Avioc Apps Store

            - **Android**: signed Avioc Apps APK. GitHub Actions signs it using the private repository secrets.
            - **Windows 32-bit**: [`Avioc-Apps-Setup-ia32.exe`](Avioc-Apps-Setup-ia32.exe) *(unsigned)*
            - **Windows 64-bit**: [`Avioc-Apps-Setup-x64.exe`](Avioc-Apps-Setup-x64.exe) *(unsigned)*
            - **Mac**: versioned Avioc Apps `.dmg` *(unsigned; requires the normal macOS first-open confirmation)*
            - **Linux x64 / ARM64**: versioned `.AppImage` packages.
            - **iPhone/iPad**: [`Avioc-Apps.mobileconfig`](Avioc-Apps.mobileconfig), a Home Screen shortcut profile; iOS native IPA signing requires a paid Apple developer account.

            ---
            *Avioc Cinema's Android APK uses its persistent signing key. Windows installers and the Mac DMG are unsigned.*
          files: final-release/*
