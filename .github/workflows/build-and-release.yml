      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }}
          name: Avioc Cinema App Release (${{ github.event.inputs.release_version || github.ref_name || 'v1.0.0' }})
          body: |
            # 🎬 Avioc Cinema — App Release

            Release packages built by the Avioc Cinema workflow. Check each device's compatibility before installing.

            ---

            ### 🎬 Avioc Cinema

            #### 🤖 Android
            - **All Phones, Tablets & Android TV**: [`Avioc-Cinema.apk`](Avioc-Cinema.apk)

            - **Windows 32-bit**: [`Avioc-Cinema-Setup-ia32.exe`](Avioc-Cinema-Setup-ia32.exe) *(unsigned)*
            - **Windows 64-bit**: [`Avioc-Cinema-Setup-x64.exe`](Avioc-Cinema-Setup-x64.exe) *(unsigned)*
            - **Mac**: [`Avioc-Cinema-Mac.dmg`](Avioc-Cinema-Mac.dmg) *(unsigned)*

            #### 📱 iPhone & iPad
            - **Home-screen website shortcut profile**: [`Avioc-Cinema.mobileconfig`](Avioc-Cinema.mobileconfig)
              *(This adds a shortcut to the hosted website; it is not a native iOS app or IPA.)*

            ### 🛍️ Avioc Apps Store

            - **Android**: signed Avioc Apps APK. GitHub Actions signs it using the private repository secrets.
            - **Windows 32-bit**: [`Avioc-Apps-Setup-ia32.exe`](Avioc-Apps-Setup-ia32.exe) *(unsigned)*
            - **Windows 64-bit**: [`Avioc-Apps-Setup-x64.exe`](Avioc-Apps-Setup-x64.exe) *(unsigned)*
            - **Mac**: versioned Avioc Apps `.dmg` *(unsigned; requires the normal macOS first-open confirmation)*
            - **Linux x64 / ARM64**: versioned `.AppImage` packages.
            - **iPhone/iPad**: [`Avioc-Apps.mobileconfig`](Avioc-Apps.mobileconfig), a Home Screen shortcut profile; iOS native IPA signing requires a paid Apple developer account.

            ### 🌐 Clearview Browser

            - **Android**: signed Clearview Browser APK for Android 7+ on arm64 and x86_64.
            - **Source and license notices**: [`Clearview-Android-source-v1.1.1.zip`](Clearview-Android-source-v1.1.1.zip).

            ### 🏡 Our Family Hub

            - **Android**: signed offline family organizer APK. Data is stored locally on the device; family sharing across devices needs a hosted sync service.

            ### 📈 StoryShape

            - **Android**: signed offline story-arc drawing and movie-matching tool. It is not a movie player or streaming app.

            ### 📂 Core Sorter

            - **Windows x64**: portable file organizer; preview its move plan and confirm before sorting. This package is not code-signed.

            ### 🎬 CoreCut

            - **Windows x64**: portable video editor or one-click setup installer.
            - **macOS Intel / Apple Silicon**: separate x64 and arm64 DMG packages (unsigned).
            - **Linux x64 / ARM64**: AppImage packages.
            - **Android**: signed CoreCut APK with native save/share for rendered videos and projects.
            - **iPhone/iPad and other browsers**: browser/PWA edition at https://aviocwatch.b-cdn.net/corecut/. Local-file editing/export depends on browser capabilities; link import is desktop-only.

            ### 📷 Simmer Photo Studio

            - **Android**: signed offline photo editor; exports open the Android save/share screen.
            - **iPhone/iPad and desktop browsers**: installable browser edition at https://aviocwatch.b-cdn.net/simmer/ with local face models bundled for offline use.

            ### ✂️ QU!K Video Clips

            - **Android**: signed APK; saves rendered clips through Android's share/save screen.
            - **iPhone/iPad and desktop browsers**: installable browser/PWA edition at https://aviocwatch.b-cdn.net/quik/. MP4/WebM export depends on browser recording support.

            ### 🤖 AGBOT

            - **Android**: signed AI companion app. AI replies require internet access; a personal Gemini API key can be added in the app.

            ---
            *Avioc Cinema's Android APK uses its persistent signing key. Windows installers and the Mac DMG are unsigned.*
          files: final-release/*
