<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Carbon Fiber Background Texture -->
    <radialGradient id="adm-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A202C"/>
      <stop offset="60%" stop-color="#0E1218"/>
      <stop offset="100%" stop-color="#06080B"/>
    </radialGradient>

    <!-- Outer Gold Bezel -->
    <linearGradient id="adm-gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#FFD666"/>
      <stop offset="60%" stop-color="#D99B26"/>
      <stop offset="100%" stop-color="#8C5C08"/>
    </linearGradient>

    <linearGradient id="adm-gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5C08"/>
      <stop offset="100%" stop-color="#3D2602"/>
    </linearGradient>

    <!-- Neon Crimson Laser Halo -->
    <linearGradient id="adm-laser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4059"/>
      <stop offset="50%" stop-color="#FF1A38"/>
      <stop offset="100%" stop-color="#B80018"/>
    </linearGradient>

    <!-- Cyber Blue Play Core -->
    <linearGradient id="adm-blue-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDF5FF"/>
      <stop offset="35%" stop-color="#38B6FF"/>
      <stop offset="75%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003399"/>
    </linearGradient>

    <!-- Blue Lens Flare Streak -->
    <linearGradient id="adm-streak" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00C8FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00C8FF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#00C8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00C8FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="adm-laser-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="adm-blue-filter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="adm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#38B6FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Carbon Fiber Base Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#adm-bg)"/>

  <!-- Subtle Carbon Fiber Mesh Lines -->
  <g stroke="#1A202C" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="0" x2="512" y2="512"/>
    <line x1="50" y1="0" x2="512" y2="462"/>
    <line x1="100" y1="0" x2="512" y2="412"/>
    <line x1="0" y1="50" x2="462" y2="512"/>
    <line x1="0" y1="100" x2="412" y2="512"/>
  </g>

  <!-- OUTER GOLD BEZEL RING (Admin Medallion / Coin from Admin.jpg) -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#adm-gold)" stroke-width="18"/>
  <circle cx="256" cy="256" r="207" fill="none" stroke="#2D1C04" stroke-width="2"/>
  <circle cx="256" cy="256" r="225" fill="none" stroke="#2D1C04" stroke-width="2"/>

  <!-- Concentric Inner Channel -->
  <circle cx="256" cy="256" r="196" fill="#0D1117" stroke="#3D2908" stroke-width="4"/>

  <!-- NEON CRIMSON LASER HALO (From Admin.jpg) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#adm-laser)" stroke-width="7" filter="url(#adm-laser-glow)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="#FFA3B0" stroke-width="2" opacity="0.85"/>

  <!-- Dark Inner Substrate -->
  <circle cx="256" cy="256" r="162" fill="#0A0E14"/>

  <!-- MICROCHIP PCB CIRCUIT BOARD TRACES (Radiating toward the center) -->
  <g stroke="#D99B26" stroke-width="2" opacity="0.55" fill="none" stroke-linecap="round">
    <!-- Top Circuit Lines -->
    <path d="M 220,105 L 220,135 L 235,150 M 256,98 L 256,145 M 292,105 L 292,135 L 277,150"/>
    <!-- Left Circuit Lines -->
    <path d="M 105,220 L 140,220 L 155,235 M 98,256 L 150,256 M 105,292 L 135,292 L 150,277"/>
    <!-- Right Circuit Lines -->
    <path d="M 407,220 L 372,220 L 357,235 M 414,256 L 362,256 M 407,292 L 377,292 L 362,277"/>
    <!-- Bottom Circuit Lines -->
    <path d="M 220,407 L 220,377 L 235,362 M 256,414 L 256,367 M 292,407 L 292,377 L 277,362"/>
    <!-- Gold Solder Sockets / Dots -->
    <circle cx="220" cy="105" r="3" fill="#FFD666"/>
    <circle cx="256" cy="98" r="3" fill="#FFD666"/>
    <circle cx="292" cy="105" r="3" fill="#FFD666"/>
    <circle cx="105" cy="220" r="3" fill="#FFD666"/>
    <circle cx="98" cy="256" r="3" fill="#FFD666"/>
    <circle cx="105" cy="292" r="3" fill="#FFD666"/>
    <circle cx="407" cy="220" r="3" fill="#FFD666"/>
    <circle cx="414" cy="256" r="3" fill="#FFD666"/>
    <circle cx="407" cy="292" r="3" fill="#FFD666"/>
    <circle cx="220" cy="407" r="3" fill="#FFD666"/>
    <circle cx="256" cy="414" r="3" fill="#FFD666"/>
    <circle cx="292" cy="407" r="3" fill="#FFD666"/>
  </g>

  <!-- Blue Microprocessor Die Socket behind "A" -->
  <rect x="186" y="176" width="140" height="160" rx="8" fill="#0C2036" stroke="#1D4E7A" stroke-width="2.5" opacity="0.8"/>
  <g fill="#1D4E7A">
    <!-- CPU Socket Pins -->
    <rect x="178" y="196" width="6" height="4" rx="1"/>
    <rect x="178" y="216" width="6" height="4" rx="1"/>
    <rect x="178" y="236" width="6" height="4" rx="1"/>
    <rect x="178" y="256" width="6" height="4" rx="1"/>
    <rect x="178" y="276" width="6" height="4" rx="1"/>
    <rect x="178" y="296" width="6" height="4" rx="1"/>
    <rect x="328" y="196" width="6" height="4" rx="1"/>
    <rect x="328" y="216" width="6" height="4" rx="1"/>
    <rect x="328" y="236" width="6" height="4" rx="1"/>
    <rect x="328" y="256" width="6" height="4" rx="1"/>
    <rect x="328" y="276" width="6" height="4" rx="1"/>
    <rect x="328" y="296" width="6" height="4" rx="1"/>
  </g>

  <!-- Horizontal Blue Laser Anamorphic Streak -->
  <rect x="110" y="254" width="292" height="3" fill="url(#adm-streak)"/>

  <!-- THE GOLDEN 3D "A" EMBLEM (From Admin.jpg) -->
  <g filter="url(#adm-shadow)">
    <!-- 3D Beveled Underside -->
    <path d="M 256,150 
             L 348,354 
             L 338,362 
             L 298,362 
             L 306,354 
             L 274,282 
             L 238,282 
             L 206,354 
             L 214,362 
             L 174,362 
             L 164,354 
             Z" 
          fill="url(#adm-gold-dark)"/>

    <!-- Front Beveled Golden Face -->
    <path d="M 256,150 
             L 348,354 
             L 304,354 
             L 272,280 
             L 240,280 
             L 208,354 
             L 164,354 
             Z
             M 256,204 
             L 240,250 
             L 272,250 
             Z" 
          fill="url(#adm-gold)" 
          fill-rule="evenodd"/>

    <!-- Left Leg Specular Highlight -->
    <path d="M 256,150 L 164,354 L 184,354 L 256,180 Z" fill="#FFFFFF" opacity="0.35"/>

    <!-- CYBER BLUE PLAY CORE (From Admin.jpg) -->
    <g filter="url(#adm-blue-filter)">
      <!-- Outer Glowing Play Triangle -->
      <path d="M 244,232 
               C 244,226 250,222 255,225 
               L 292,246 
               C 297,249 297,257 292,260 
               L 255,281 
               C 250,284 244,280 244,274 
               Z" 
            fill="url(#adm-blue-glow)"/>

      <!-- Inner White Lens Point -->
      <path d="M 247,238 L 284,253 L 247,268 Z" fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- Laser Lens Flare Glint at Right Corner of Play Button -->
    <polygon points="296,253 298,250 304,253 298,256" fill="#FFF"/>
    <polygon points="296,253 294,248 296,242 298,248" fill="#FFF"/>
  </g>
</svg>