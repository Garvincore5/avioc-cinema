<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="tv-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2a122e"/>
      <stop offset="60%" stop-color="#140718"/>
      <stop offset="100%" stop-color="#08020a"/>
    </radialGradient>
    <linearGradient id="tv-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="tv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tv-bg)" stroke="#d946ef" stroke-width="6"/>
  <!-- TV Monitor & Antenna -->
  <path d="M190,130 L256,190 L322,130" fill="none" stroke="#ffb800" stroke-width="12" stroke-linecap="round"/>
  <rect x="100" y="190" width="312" height="210" rx="30" fill="#180b22" stroke="url(#tv-purple)" stroke-width="12"/>
  <!-- Broadcast Signal inside Screen -->
  <circle cx="256" cy="310" r="14" fill="#ff2a5f" filter="url(#tv-glow)"/>
  <path d="M224,278 A 45 45 0 0 1 288 278" fill="none" stroke="#ffb800" stroke-width="8" stroke-linecap="round"/>
  <path d="M200,254 A 80 80 0 0 1 312 254" fill="none" stroke="#00f0ff" stroke-width="8" stroke-linecap="round"/>
  <!-- Stand -->
  <path d="M226,400 L210,430 L302,430 L286,400" fill="#d946ef"/>
</svg>
