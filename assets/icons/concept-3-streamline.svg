<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181324"/>
      <stop offset="50%" stop-color="#0F0C17"/>
      <stop offset="100%" stop-color="#08060D"/>
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="c3-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="35%" stop-color="#FFD159"/>
      <stop offset="75%" stop-color="#F39C24"/>
      <stop offset="100%" stop-color="#D4730A"/>
    </linearGradient>

    <linearGradient id="c3-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="50%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#D81B43"/>
    </linearGradient>

    <radialGradient id="c3-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3A43B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0F0C17" stop-opacity="0"/>
    </radialGradient>

    <filter id="c3-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F3A43B" flood-opacity="0.3"/>
    </filter>

    <filter id="c3-play-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FF385C" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#c3-bg)"/>
  <circle cx="256" cy="260" r="210" fill="url(#c3-glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#c3-gold)" stroke-width="2.5" opacity="0.4"/>

  <!-- Main Monogram Group -->
  <g filter="url(#c3-shadow)">
    <!-- Main Sweeping 'A' Frame: Left Arch + Top Peak + Right Leg -->
    <path d="M 256,104 
             C 264,104 271,108 276,115 
             L 396,358 
             C 400,366 395,376 385,376 
             L 326,376 
             C 319,376 313,371 310,364 
             L 282,302 
             L 204,302 
             L 182,352 
             C 178,360 171,365 162,365 
             L 115,365 
             C 105,365 99,355 104,346 
             L 236,115 
             C 241,108 248,104 256,104 
             Z 
             M 256,192 
             L 220,266 
             L 264,266 
             Z" 
          fill="url(#c3-gold)"/>

    <!-- Left Wing Sleek Specular Highlight -->
    <path d="M 256,104 
             L 104,346 
             C 99,355 105,365 115,365 
             L 162,365 
             C 171,365 178,360 182,352 
             L 256,182 
             Z" 
          fill="#FFFFFF" 
          opacity="0.22"/>

    <!-- The Play Delta (Forward kinetic Cinema engine) -->
    <g filter="url(#c3-play-glow)">
      <path d="M 230,226 
               C 230,217 240,211 248,216 
               L 336,268 
               C 344,273 344,285 336,290 
               L 248,342 
               C 240,347 230,341 230,332 
               Z" 
            fill="url(#c3-play)"/>

      <!-- Inner Crisp Arrow Reflection -->
      <path d="M 238,236 
               L 316,279 
               L 238,322 
               Z" 
            fill="#FFF" 
            opacity="0.28"/>
    </g>

    <!-- Floating Live Broadcast Node -->
    <circle cx="396" cy="140" r="14" fill="#FF385C"/>
    <circle cx="396" cy="140" r="7" fill="#FFFFFF"/>
    <circle cx="396" cy="140" r="22" fill="none" stroke="#FF385C" stroke-width="2" opacity="0.45"/>
  </g>
</svg>