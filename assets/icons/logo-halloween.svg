<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Wood Planks Squircle Background -->
    <linearGradient id="hw-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C16"/>
      <stop offset="50%" stop-color="#14100D"/>
      <stop offset="100%" stop-color="#090706"/>
    </linearGradient>

    <!-- Wood Rim -->
    <linearGradient id="hw-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F3D2E"/>
      <stop offset="100%" stop-color="#1C140D"/>
    </linearGradient>

    <!-- Glowing Pumpkin Fire / Embers -->
    <linearGradient id="hw-ember" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E1B"/>
      <stop offset="50%" stop-color="#FF5400"/>
      <stop offset="100%" stop-color="#B32B00"/>
    </linearGradient>

    <!-- Weathered Bronze / Verdigris "A" -->
    <linearGradient id="hw-bronze" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#C29255"/>
      <stop offset="35%" stop-color="#7D5728"/>
      <stop offset="70%" stop-color="#477364"/>
      <stop offset="100%" stop-color="#25473E"/>
    </linearGradient>

    <!-- Neon Toxic Green Play Core -->
    <linearGradient id="hw-green-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAFFD9"/>
      <stop offset="30%" stop-color="#80FF38"/>
      <stop offset="75%" stop-color="#1AE635"/>
      <stop offset="100%" stop-color="#008A1E"/>
    </linearGradient>

    <!-- Witch Hat Leather & Velvet -->
    <linearGradient id="hw-witch-hat" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4E3D52"/>
      <stop offset="45%" stop-color="#2D2133"/>
      <stop offset="85%" stop-color="#17111A"/>
      <stop offset="100%" stop-color="#0C080E"/>
    </linearGradient>

    <linearGradient id="hw-buckle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="hw-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="hw-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5400" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Wood Planks Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#hw-wood)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#hw-rim)" stroke-width="3"/>

  <!-- Vertical Wood Plank Lines -->
  <g stroke="#0A0807" stroke-width="3" opacity="0.7">
    <line x1="140" y1="10" x2="140" y2="502"/>
    <line x1="230" y1="10" x2="230" y2="502"/>
    <line x1="320" y1="10" x2="320" y2="502"/>
    <line x1="400" y1="10" x2="400" y2="502"/>
  </g>

  <!-- Glowing Fiery Cracks / Runes Behind the "A" (From halloween.jpeg) -->
  <g filter="url(#hw-glow)" stroke="url(#hw-ember)" stroke-width="4" stroke-linecap="round" fill="none">
    <!-- Left Triangular Ember Crack -->
    <path d="M 170,180 L 130,230 L 175,270"/>
    <!-- Center Crevice -->
    <path d="M 256,360 L 256,410"/>
    <!-- Right Notch -->
    <path d="M 350,280 L 370,330"/>
    <line x1="190" y1="120" x2="190" y2="160"/>
    <line x1="345" y1="140" x2="345" y2="180"/>
  </g>

  <!-- Spiderwebs in Corners -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.35" fill="none">
    <!-- Top Left Web -->
    <path d="M 30,30 L 170,160 M 30,30 L 190,90 M 30,30 L 90,190"/>
    <path d="M 60,70 Q 75,60 90,45 M 90,105 Q 120,90 140,65 M 120,140 Q 155,120 175,85"/>
    <path d="M 45,90 Q 60,75 70,60 M 65,140 Q 90,120 105,90 M 85,175 Q 120,155 140,120"/>
    <!-- Bottom Right Web -->
    <path d="M 480,480 L 340,350 M 480,480 L 320,420 M 480,480 L 420,320"/>
    <path d="M 450,440 Q 435,450 420,465 M 420,405 Q 390,420 370,445 M 390,370 Q 355,390 335,425"/>
    <!-- Spider hanging -->
    <line x1="110" y1="200" x2="110" y2="235" stroke="#FFFFFF" stroke-width="0.8"/>
    <circle cx="110" cy="238" r="4" fill="#1C1820"/>
    <circle cx="110" cy="244" r="6" fill="#1C1820"/>
    <!-- Spider legs -->
    <path d="M 106,240 Q 98,235 96,245 M 114,240 Q 122,235 124,245" stroke="#1C1820" stroke-width="1.2"/>
    <path d="M 106,244 Q 96,245 94,255 M 114,244 Q 124,245 126,255" stroke="#1C1820" stroke-width="1.2"/>
  </g>

  <!-- Flying Halloween Bats -->
  <g fill="#141017" opacity="0.75">
    <path d="M 370,170 Q 380,160 390,165 Q 400,160 410,170 Q 395,175 390,180 Q 385,175 370,170 Z"/>
    <path d="M 390,290 Q 398,282 406,286 Q 414,282 422,290 Q 410,294 406,298 Q 402,294 390,290 Z" transform="scale(0.8) translate(70, 40)"/>
  </g>

  <!-- WEATHERED BRONZE & PATINA "A" FRAME -->
  <g filter="url(#hw-shadow)">
    <!-- Base "A" Shape -->
    <path d="M 256,160 
             L 366,386 
             L 316,386 
             L 278,306 
             L 234,306 
             L 196,386 
             L 146,386 
             Z
             M 256,220 
             L 238,272 
             L 274,272 
             Z" 
          fill="url(#hw-bronze)" 
          fill-rule="evenodd"/>

    <!-- Patina / Verdigris Oxidation Splatters (from halloween.jpeg) -->
    <path d="M 180,330 Q 190,320 200,335 Q 210,345 200,355 Q 185,350 180,330 Z" fill="#38B289" opacity="0.6"/>
    <path d="M 310,320 Q 325,315 330,330 Q 335,345 320,355 Q 305,340 310,320 Z" fill="#38B289" opacity="0.65"/>
    <path d="M 245,185 Q 255,180 260,195 Q 250,205 242,195 Z" fill="#38B289" opacity="0.55"/>

    <!-- Specular Highlight -->
    <path d="M 256,160 L 146,386 L 166,386 L 256,190 Z" fill="#FFFFFF" opacity="0.18"/>

    <!-- NEON TOXIC GREEN PLAY TRIANGLE (Glowing from inside the "A") -->
    <g filter="url(#hw-glow)">
      <path d="M 242,250 
               C 242,242 250,237 256,241 
               L 298,266 
               C 304,270 304,280 298,284 
               L 256,309 
               C 250,313 242,308 242,300 
               Z" 
            fill="url(#hw-green-glow)"/>

      <!-- Radiant Center Play Core -->
      <path d="M 248,258 L 288,275 L 248,292 Z" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- WITCH HAT WITH BUCKLE AND FEATHER (From halloween.jpeg) -->
  <g filter="url(#hw-shadow)">
    <!-- Wide Curved Hat Brim -->
    <path d="M 160,165 
             C 175,145 230,135 285,145 
             C 335,155 365,185 355,195 
             C 345,205 290,195 240,185 
             C 195,175 150,185 160,165 
             Z" 
          fill="url(#hw-witch-hat)"/>

    <!-- Tall Twisted Hat Cone with Creases -->
    <path d="M 215,155 
             C 210,110 240,70 270,55 
             C 295,45 325,50 345,75 
             C 355,85 360,95 345,95 
             C 330,95 320,80 305,75 
             C 285,70 265,95 260,120 
             C 255,135 258,150 258,150 
             Z" 
          fill="url(#hw-witch-hat)"/>

    <!-- Leather Hat Band -->
    <path d="M 214,152 C 228,142 258,142 278,148 L 278,162 C 258,156 228,156 214,166 Z" fill="#1A131E"/>

    <!-- Silver Buckle on Hat Band -->
    <rect x="238" y="142" width="28" height="24" rx="4" fill="none" stroke="url(#hw-buckle)" stroke-width="4"/>
    <line x1="252" y1="142" x2="252" y2="166" stroke="url(#hw-buckle)" stroke-width="3"/>

    <!-- Dried Autumn Feather & Twigs Sticking Out of Hat -->
    <path d="M 275,142 Q 310,120 330,125 Q 315,135 275,148 Z" fill="#786B59"/>
    <line x1="275" y1="145" x2="330" y2="125" stroke="#42392D" stroke-width="1.5"/>
    <line x1="280" y1="140" x2="310" y2="110" stroke="#8C6E4A" stroke-width="1.8"/>
  </g>
</svg>