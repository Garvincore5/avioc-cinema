<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E172D"/>
      <stop offset="100%" stop-color="#0F0C17"/>
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="30%" stop-color="#FFD269"/>
      <stop offset="70%" stop-color="#F3A43B"/>
      <stop offset="100%" stop-color="#CA7513"/>
    </linearGradient>

    <!-- Santa Hat Gradient -->
    <linearGradient id="santaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF485E"/>
      <stop offset="50%" stop-color="#D9162C"/>
      <stop offset="100%" stop-color="#8F0515"/>
    </linearGradient>

    <!-- Snow Gradient -->
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#EEF5FD"/>
      <stop offset="100%" stop-color="#C5DCF8"/>
    </linearGradient>

    <!-- Ice Crystal Glow -->
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#80B8FF" flood-opacity="0.45"/>
    </filter>

    <!-- Drop Shadow for 'A' -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F3A43B" flood-opacity="0.3"/>
    </filter>

    <filter id="hatShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F3A43B" stroke-width="16" stroke-opacity="0.35"/>

  <!-- Subtle holiday background snowflakes -->
  <g fill="#FFFFFF" opacity="0.45">
    <circle cx="80" cy="112" r="6"/>
    <circle cx="432" cy="128" r="7"/>
    <circle cx="96" cy="336" r="5"/>
    <circle cx="440" cy="368" r="6.5"/>
    <circle cx="160" cy="432" r="4.5"/>
    <circle cx="380" cy="440" r="5.5"/>
  </g>

  <!-- Twinkling stars -->
  <path d="M 90,190 Q 90,205 105,205 Q 90,205 90,220 Q 90,205 75,205 Q 90,205 90,190 Z" fill="#FFE8A3" opacity="0.55"/>
  <path d="M 425,240 Q 425,252 437,252 Q 425,252 425,264 Q 425,252 413,252 Q 425,252 425,240 Z" fill="#FFE8A3" opacity="0.55"/>

  <!-- THE EXACT ORIGINAL "A" MONOGRAM (Scale: 8x of original path) -->
  <g filter="url(#dropShadow)">
    <path d="M 256,96 
             L 368,384 
             L 300,384 
             L 272,304 
             L 204,304 
             L 204,256 
             L 288,256 
             L 256,160 
             L 216,256 
             L 176,256 
             L 256,96 
             Z" 
          fill="url(#goldGrad)"/>

    <!-- Subtle inner specular bevel along original lines -->
    <path d="M 256,96 L 176,256 L 216,256 L 256,160 Z" fill="#FFFFFF" opacity="0.22"/>
  </g>

  <!-- THE EXACT ORIGINAL RED BEACON CIRCLE (Scale: 8x of original circle cx=43 cy=20 r=3) -->
  <circle cx="344" cy="160" r="24" fill="#E5484D" filter="url(#iceGlow)"/>
  <circle cx="344" cy="160" r="12" fill="#FFF2F4"/>

  <!-- REALISTIC SNOW & ICICLES ON THE ORIGINAL "A" -->
  <g filter="url(#iceGlow)">
    <!-- Snow & Dripping Icicles along the Horizontal Play Crossbar (y=256) -->
    <path d="M 176,256 
             Q 192,244 216,248 
             Q 236,240 256,248 
             Q 272,242 288,256 
             L 284,268 
             Q 272,284 264,266 
             Q 250,290 238,266 
             Q 224,286 216,268 
             Q 200,288 192,268 
             Q 184,278 176,256 
             Z" 
          fill="url(#snowGrad)"/>

    <!-- Snow on Lower Notch (y=304) -->
    <path d="M 204,304 
             Q 224,292 248,296 
             Q 262,292 272,304 
             L 268,316 
             Q 254,328 244,312 
             Q 230,326 218,312 
             L 204,304 
             Z" 
          fill="url(#snowGrad)"/>

    <!-- Snow Layer on Bottom Right Foot (y=384) -->
    <path d="M 300,384 
             Q 324,370 348,372 
             Q 360,370 368,384 
             L 368,394 
             Q 344,400 324,396 
             Q 308,396 300,384 
             Z" 
          fill="url(#snowGrad)"/>

    <!-- Frost crystals glistening down the right slope -->
    <path d="M 272,136 L 352,344" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="12 16" stroke-linecap="round" opacity="0.65"/>
    <circle cx="288" cy="180" r="5" fill="#FFFFFF"/>
    <circle cx="320" cy="260" r="6" fill="#FFFFFF"/>
    <circle cx="340" cy="312" r="5" fill="#FFFFFF"/>
  </g>

  <!-- CHRISTMAS SANTA CAP (Tilted naturally over the original apex at 256, 96) -->
  <g filter="url(#hatShadow)">
    <!-- Red Velvet Cap Body -->
    <path d="M 224,112 
             C 224,48 272,24 320,32 
             C 360,40 384,72 376,104 
             C 368,120 352,128 336,128 
             C 328,112 344,88 328,64 
             C 304,48 272,48 248,64 
             C 236,72 228,88 224,112 
             Z" 
          fill="url(#santaRed)"/>

    <!-- Velvet Fold Shadow -->
    <path d="M 264,52 
             C 300,48 328,60 344,84 
             C 336,72 312,60 280,60 
             C 260,60 244,68 236,84 
             C 240,70 250,58 264,52 
             Z" 
          fill="#59020D" 
          opacity="0.45"/>

    <!-- Fluffy White Fur Brim resting across the apex of the original 'A' -->
    <g filter="url(#iceGlow)">
      <path d="M 208,116 
               C 208,104 224,96 240,102 
               C 252,94 268,94 280,102 
               C 292,94 308,98 316,106 
               C 324,114 316,124 304,126 
               C 294,132 278,130 268,122 
               C 258,130 242,130 232,124 
               C 222,128 212,124 208,116 
               Z" 
            fill="url(#snowGrad)"/>

      <!-- Fur Tufts -->
      <circle cx="228" cy="114" r="7" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="258" cy="112" r="8" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="288" cy="115" r="7" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="310" cy="116" r="6" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- White Fluffy Pom-Pom at Drooping Tip -->
    <g filter="url(#iceGlow)">
      <circle cx="344" cy="132" r="20" fill="url(#snowGrad)"/>
      <circle cx="340" cy="126" r="12" fill="#FFFFFF"/>
    </g>
  </g>
</svg>