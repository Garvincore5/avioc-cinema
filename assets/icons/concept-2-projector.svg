<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background -->
    <radialGradient id="c2-bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#231A36"/>
      <stop offset="60%" stop-color="#0F0C17"/>
      <stop offset="100%" stop-color="#060509"/>
    </radialGradient>

    <!-- Glowing Rim -->
    <linearGradient id="c2-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD666"/>
      <stop offset="40%" stop-color="#F3A43B"/>
      <stop offset="80%" stop-color="#E5484D"/>
      <stop offset="100%" stop-color="#6F0B20"/>
    </linearGradient>

    <!-- Main Gold Metal -->
    <linearGradient id="c2-gold" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="25%" stop-color="#FFD269"/>
      <stop offset="60%" stop-color="#F3A43B"/>
      <stop offset="100%" stop-color="#C26A06"/>
    </linearGradient>

    <linearGradient id="c2-ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5269"/>
      <stop offset="100%" stop-color="#B3122B"/>
    </linearGradient>

    <linearGradient id="c2-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD269" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F3A43B" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="c2-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F3A43B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#c2-bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#c2-rim)" stroke-width="2.5" opacity="0.6"/>

  <!-- Back Projector Lens Disc -->
  <circle cx="256" cy="270" r="148" fill="url(#c2-lens)" stroke="url(#c2-gold)" stroke-width="2" opacity="0.4"/>
  <circle cx="256" cy="270" r="118" fill="none" stroke="url(#c2-gold)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- Central Emblem: The Avioc 'A' + Cinema Play -->
  <g filter="url(#c2-shadow)">
    <!-- Outer Chevron / Apex of A -->
    <path d="M 256,98 
             L 378,378 
             L 316,378 
             L 282,298 
             L 230,298 
             L 196,378 
             L 134,378 
             Z
             M 256,182 
             L 242,246 
             L 270,246 
             Z" 
          fill="url(#c2-gold)" 
          fill-rule="evenodd"/>

    <!-- High-Luster Facet Sheen on Left Side -->
    <path d="M 256,98 
             L 134,378 
             L 196,378 
             L 256,238 
             Z" 
          fill="#FFFFFF" 
          opacity="0.18"/>

    <!-- Dynamic Vibrant Play Triangle in Core -->
    <path d="M 238,228 
             C 238,220 246,215 253,220 
             L 312,258 
             C 320,263 320,275 312,280 
             L 253,318 
             C 246,323 238,318 238,310 
             Z" 
          fill="url(#c2-ruby)"/>

    <path d="M 244,238 
             L 298,269 
             L 244,300 
             Z" 
          fill="#FFAAB8" 
          opacity="0.5"/>
  </g>

  <!-- Cinema Perforations (Top and Bottom Subtle Elegance) -->
  <rect x="180" y="420" width="24" height="12" rx="3" fill="#F3A43B" opacity="0.3"/>
  <rect x="216" y="420" width="24" height="12" rx="3" fill="#F3A43B" opacity="0.3"/>
  <rect x="252" y="420" width="24" height="12" rx="3" fill="#F3A43B" opacity="0.5"/>
  <rect x="288" y="420" width="24" height="12" rx="3" fill="#F3A43B" opacity="0.3"/>
  <rect x="324" y="420" width="24" height="12" rx="3" fill="#F3A43B" opacity="0.3"/>

  <!-- Live Pulse Beacon at Top Right -->
  <circle cx="372" cy="136" r="12" fill="#FF2E4D"/>
  <circle cx="372" cy="136" r="6" fill="#FFF"/>
</svg>