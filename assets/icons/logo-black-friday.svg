<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Wood Plaque -->
    <linearGradient id="bf-wood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E17"/>
      <stop offset="50%" stop-color="#140E0A"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>

    <!-- Gold Text & Accents -->
    <linearGradient id="bf-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="40%" stop-color="#D99F2E"/>
      <stop offset="100%" stop-color="#80530A"/>
    </linearGradient>

    <!-- Industrial Metal / Bronze "A" -->
    <linearGradient id="bf-metal-a" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#A88258"/>
      <stop offset="40%" stop-color="#593C20"/>
      <stop offset="80%" stop-color="#2D5447"/>
      <stop offset="100%" stop-color="#12241E"/>
    </linearGradient>

    <!-- Neon Green Digital Display / Radar Play Core -->
    <linearGradient id="bf-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5FFD9"/>
      <stop offset="35%" stop-color="#4EFA54"/>
      <stop offset="85%" stop-color="#19BD27"/>
      <stop offset="100%" stop-color="#086612"/>
    </linearGradient>

    <!-- Metal Pennant Flag -->
    <linearGradient id="bf-flag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8A48B"/>
      <stop offset="50%" stop-color="#857159"/>
      <stop offset="100%" stop-color="#4A3C2B"/>
    </linearGradient>

    <filter id="bf-green-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="bf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Dark Reclaimed Wood Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bf-wood)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#543E2C" stroke-width="3"/>

  <!-- Vertical Wood Planks -->
  <g stroke="#0D0907" stroke-width="2.5" opacity="0.6">
    <line x1="130" y1="10" x2="130" y2="502"/>
    <line x1="256" y1="10" x2="256" y2="502"/>
    <line x1="382" y1="10" x2="382" y2="502"/>
  </g>

  <!-- Etched Cinema Doodles (Cameras, Tickets, Film Reels, Popcorn) -->
  <g stroke="#80654D" stroke-width="1.8" opacity="0.32" fill="none">
    <!-- Movie Camera on Left -->
    <rect x="75" y="270" width="30" height="20" rx="3"/>
    <circle cx="83" cy="260" r="7"/>
    <circle cx="97" cy="260" r="7"/>
    <polygon points="105,275 120,268 120,292 105,285" fill="#80654D"/>
    <!-- Film Reel on Right -->
    <circle cx="430" cy="275" r="16"/>
    <circle cx="430" cy="275" r="5"/>
    <!-- Movie Ticket on Right -->
    <rect x="365" y="315" width="45" height="24" rx="2" transform="rotate(-25 365 315)"/>
  </g>

  <!-- "BLACK FRIDAY" TOP HEADER (From black friday.jpeg) -->
  <g font-family="'Archivo', 'Impact', sans-serif" font-weight="900" font-size="28" letter-spacing="2" fill="url(#bf-gold)">
    <text x="80" y="80">BLACK</text>
    <text x="80" y="112">FRIDAY</text>
  </g>
  <text x="80" y="132" font-family="'Figtree', sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#D99F2E">CINEMA BLITZ</text>

  <!-- INDUSTRIAL METAL / BRONZE "A" WITH FILM PERFORATIONS -->
  <g filter="url(#bf-shadow)">
    <!-- Base "A" Shape -->
    <path d="M 256,160 
             L 364,370 
             L 316,370 
             L 282,296 
             L 230,296 
             L 196,370 
             L 148,370 
             Z
             M 256,216 
             L 238,266 
             L 274,266 
             Z" 
          fill="url(#bf-metal-a)" 
          fill-rule="evenodd"/>

    <!-- Film Sprocket / Perforation Holes along Left & Right Legs -->
    <g fill="#0D0A07">
      <!-- Left Leg Film Perforations -->
      <rect x="180" y="340" width="8" height="5" rx="1" transform="rotate(-30 180 340)"/>
      <rect x="200" y="305" width="8" height="5" rx="1" transform="rotate(-30 200 305)"/>
      <rect x="220" y="270" width="8" height="5" rx="1" transform="rotate(-30 220 270)"/>
      <rect x="240" y="235" width="8" height="5" rx="1" transform="rotate(-30 240 235)"/>
      <!-- Right Leg Film Perforations -->
      <rect x="325" y="340" width="8" height="5" rx="1" transform="rotate(30 325 340)"/>
      <rect x="305" y="305" width="8" height="5" rx="1" transform="rotate(30 305 305)"/>
      <rect x="285" y="270" width="8" height="5" rx="1" transform="rotate(30 285 270)"/>
      <rect x="265" y="235" width="8" height="5" rx="1" transform="rotate(30 265 235)"/>
    </g>

    <!-- NEON GREEN DIGITAL RADAR / PLAY CORE (From black friday.jpeg) -->
    <g filter="url(#bf-green-glow)">
      <path d="M 242,242 
               C 242,236 248,232 254,235 
               L 294,258 
               C 300,261 300,269 294,272 
               L 254,295 
               C 248,298 242,294 242,288 
               Z" 
            fill="url(#bf-green)"/>
      <!-- Soundwave / Radar Pulse Lines inside Play Button -->
      <line x1="250" y1="265" x2="278" y2="265" stroke="#FFF" stroke-width="2"/>
      <line x1="255" y1="255" x2="270" y2="255" stroke="#FFF" stroke-width="1.5"/>
      <line x1="255" y1="275" x2="270" y2="275" stroke="#FFF" stroke-width="1.5"/>
    </g>
  </g>

  <!-- "DOORBUSTER" PENNANT FLAG (Mounted on top of the "A") -->
  <g filter="url(#bf-shadow)">
    <!-- Flagpole -->
    <line x1="256" y1="160" x2="280" y2="95" stroke="#E2E8F0" stroke-width="4"/>
    <circle cx="280" cy="95" r="5" fill="#FFD666"/>
    <!-- Flag Body -->
    <path d="M 280,100 L 415,145 L 395,190 L 268,145 Z" fill="url(#bf-flag)" stroke="#3D2E1E" stroke-width="2"/>
    <g font-family="'Archivo', sans-serif" fill="#FFF" transform="rotate(18 280 100)">
      <text x="290" y="130" font-size="14" font-weight="900" letter-spacing="1">DOORBUSTER</text>
      <text x="290" y="142" font-size="8" font-weight="700" fill="#E2E8F0">UNLIMITED MOVIE PASS</text>
    </g>
  </g>

  <!-- DIGITAL COUNTDOWN TIMER DISPLAY: 02:00:00 (From black friday.jpeg) -->
  <g filter="url(#bf-shadow)">
    <!-- Brass / Metal Bezel Casing -->
    <rect x="195" y="390" width="122" height="42" rx="8" fill="#1C150D" stroke="#D99F2E" stroke-width="3"/>
    <!-- LED Glow Screen -->
    <rect x="202" y="396" width="108" height="30" rx="4" fill="#061208"/>
    <!-- Digital 7-Segment Green Digits -->
    <text x="256" y="418" font-family="'Courier New', monospace" font-size="19" font-weight="900" fill="#4EFA54" letter-spacing="2" text-anchor="middle" filter="url(#bf-green-glow)">02:00:00</text>
  </g>

  <!-- BOTTOM BANNER: "GET YOUR PASSES NOW!" -->
  <g filter="url(#bf-shadow)">
    <rect x="110" y="450" width="292" height="34" rx="4" fill="#17120C" stroke="#D99F2E" stroke-width="2"/>
    <text x="256" y="473" font-family="'Archivo', sans-serif" font-weight="900" font-size="14" letter-spacing="2" fill="url(#bf-gold)" text-anchor="middle">GET YOUR PASSES NOW!</text>
  </g>
</svg>