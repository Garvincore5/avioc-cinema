<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Distressed Parchment / Currency Paper Squircle -->
    <linearGradient id="usd-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5D9C3"/>
      <stop offset="50%" stop-color="#B8A88F"/>
      <stop offset="100%" stop-color="#807058"/>
    </linearGradient>

    <!-- Crimson Emergency Rim -->
    <linearGradient id="usd-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#8A0B20"/>
    </linearGradient>

    <!-- Weathered Bronze / Patina "A" -->
    <linearGradient id="usd-bronze" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#B88A52"/>
      <stop offset="50%" stop-color="#6E4D25"/>
      <stop offset="80%" stop-color="#3A6657"/>
      <stop offset="100%" stop-color="#1A382E"/>
    </linearGradient>

    <!-- Play Core Warm Glow -->
    <linearGradient id="usd-play" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFD666"/>
      <stop offset="100%" stop-color="#FF9E1B"/>
    </linearGradient>

    <filter id="usd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Distressed Paper Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#usd-paper)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="url(#usd-crimson)" stroke-width="3.5"/>

  <!-- EXCHANGE RATE GRAPH (From usd crisis.jpg) -->
  <g opacity="0.45" stroke="#3D3222" stroke-width="1.5" fill="none">
    <line x1="80" y1="210" x2="430" y2="210"/>
    <line x1="80" y1="160" x2="430" y2="160"/>
    <line x1="80" y1="110" x2="430" y2="110"/>
  </g>
  <!-- Soaring Green USD Arrow Curve -->
  <path d="M 280,220 L 330,170 L 370,190 L 420,110" stroke="#1E7A38" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <polygon points="420,110 405,115 418,128" fill="#1E7A38"/>

  <!-- Plunging Red UGX Arrow -->
  <path d="M 90,140 L 130,180" stroke="#C9182B" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <polygon points="130,180 120,170 133,168" fill="#C9182B"/>

  <!-- TEXT LABELS (From usd crisis.jpg) -->
  <g font-family="'Archivo', sans-serif" font-weight="900">
    <text x="135" y="85" font-size="14" fill="#2B2114">UGX to USD</text>
    <text x="110" y="115" font-size="16" fill="#C9182B">UGX ↓</text>
    <text x="320" y="85" font-size="15" fill="#1E7A38">1 USD = <tspan fill="#C9182B">5000+ UGX</tspan></text>
  </g>

  <!-- MOVIE CLAPPERBOARD: "A-FILMS" (From usd crisis.jpg) -->
  <g transform="rotate(-15 140 250)" filter="url(#usd-shadow)">
    <rect x="115" y="240" width="46" height="34" rx="2" fill="#1A1510"/>
    <rect x="115" y="232" width="46" height="8" rx="1" fill="#FFF"/>
    <!-- Diagonal Stripes on Clapper Stick -->
    <polygon points="120,232 124,232 119,240 115,240" fill="#1A1510"/>
    <polygon points="132,232 136,232 131,240 127,240" fill="#1A1510"/>
    <polygon points="144,232 148,232 143,240 139,240" fill="#1A1510"/>
    <text x="138" y="262" font-family="'Archivo', sans-serif" font-size="7" font-weight="900" fill="#F3A43B" text-anchor="middle">A-FILMS</text>
  </g>

  <!-- WEATHERED "A" WITH PATINA & RUST (Center of usd crisis.jpg) -->
  <g filter="url(#usd-shadow)">
    <path d="M 256,155 
             L 364,375 
             L 316,375 
             L 280,298 
             L 232,298 
             L 196,375 
             L 148,375 
             Z
             M 256,215 
             L 238,268 
             L 274,268 
             Z" 
          fill="url(#usd-bronze)" 
          fill-rule="evenodd"/>

    <!-- Verdigris / Rust spots -->
    <path d="M 248,175 Q 260,170 262,185 Q 255,195 245,188 Z" fill="#4ADE80" opacity="0.6"/>
    <path d="M 180,335 Q 190,325 198,340 Q 192,352 182,345 Z" fill="#4ADE80" opacity="0.55"/>
    <path d="M 315,325 Q 328,320 332,335 Q 325,348 316,340 Z" fill="#4ADE80" opacity="0.55"/>

    <!-- GLOWING WARM PLAY TRIANGLE IN CENTER -->
    <g filter="url(#usd-shadow)">
      <path d="M 242,242 
               C 242,236 248,232 254,235 
               L 294,258 
               C 300,261 300,269 294,272 
               L 254,295 
               C 248,298 242,294 242,288 
               Z" 
            fill="url(#usd-play)"/>
      <path d="M 246,248 L 286,265 L 246,282 Z" fill="#FFFFFF" opacity="0.8"/>
    </g>
  </g>

  <!-- CARDBOARD PLACARDS: "TOO EXPENSIVE" & "POVERTY IN UGANDA" -->
  <g filter="url(#usd-shadow)">
    <!-- "TOO EXPENSIVE" placard -->
    <rect x="185" y="365" width="75" height="32" rx="3" fill="#D9C7A7" stroke="#7A684C" stroke-width="1.5" transform="rotate(-6 185 365)"/>
    <text x="220" y="386" font-family="'Archivo', sans-serif" font-weight="900" font-size="9" fill="#1F180F" text-anchor="middle" transform="rotate(-6 185 365)">TOO EXPENSIVE</text>

    <!-- "POVERTY IN UGANDA" placard -->
    <rect x="305" y="380" width="90" height="34" rx="3" fill="#C7B493" stroke="#66543A" stroke-width="1.5" transform="rotate(8 305 380)"/>
    <text x="350" y="396" font-family="'Archivo', sans-serif" font-weight="900" font-size="8" fill="#1F180F" text-anchor="middle" transform="rotate(8 305 380)">POVERTY IN</text>
    <text x="350" y="407" font-family="'Archivo', sans-serif" font-weight="900" font-size="8.5" fill="#C9182B" text-anchor="middle" transform="rotate(8 305 380)">UGANDA</text>
  </g>

  <!-- SILHOUETTED HANDS REACHING UPWARD TOWARD CINEMA EMBLEM -->
  <g fill="#4A3B2C" opacity="0.85">
    <!-- Center hand reaching to play button -->
    <path d="M 248,430 L 250,340 Q 253,334 256,340 L 258,430 Z"/>
    <path d="M 240,430 L 244,345 Q 247,340 249,345 L 251,430 Z"/>
    <path d="M 258,430 L 261,348 Q 263,344 265,348 L 267,430 Z"/>
    <!-- Left Hand -->
    <path d="M 180,440 L 195,370 Q 198,365 201,370 L 210,440 Z"/>
    <!-- Right Hand -->
    <path d="M 320,440 L 310,365 Q 307,360 304,365 L 295,440 Z"/>
  </g>
</svg>