<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD269"/>
      <stop offset="100%" stop-color="#F3A43B"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E172D"/>
      <stop offset="100%" stop-color="#0F0C17"/>
    </linearGradient>
    <linearGradient id="santaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4359"/>
      <stop offset="100%" stop-color="#C71026"/>
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7E7FA"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#80B8FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Original Background & Border -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#F3A43B" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Subtle holiday background snow specks -->
  <circle cx="10" cy="14" r="0.8" fill="#FFF" opacity="0.6"/>
  <circle cx="54" cy="16" r="0.9" fill="#FFF" opacity="0.5"/>
  <circle cx="12" cy="42" r="0.7" fill="#FFF" opacity="0.4"/>
  <circle cx="55" cy="46" r="0.8" fill="#FFF" opacity="0.5"/>
  <circle cx="20" cy="54" r="0.6" fill="#FFF" opacity="0.4"/>

  <!-- THE EXACT ORIGINAL "A" MONOGRAM (Pixel-for-pixel matched) -->
  <path d="M32 12 L46 48 L37.5 48 L34 38 L25.5 38 L25.5 32 L36 32 L32 20 L27 32 L22 32 L32 12 Z" fill="url(#goldGrad)"/>

  <!-- THE ORIGINAL RED DOT -->
  <circle cx="43" cy="20" r="3" fill="#E5484D"/>

  <!-- SNOW & ICE ON THE ORIGINAL "A" -->
  <!-- Snow & Icicles on the Crossbar (y=32 and y=38) -->
  <path d="M22 32 Q24 30.5 27 31 Q31.5 30 36 32 L35.5 33.5 Q34 35 33 33 Q31 35.5 29 33 Q27 35 25 33 L22 32 Z" fill="url(#snowGrad)" filter="url(#iceGlow)"/>
  <path d="M25.5 38 Q29.5 36.5 34 38 L33.5 39.5 Q31 41 29 39 Q27 40.5 25.5 38 Z" fill="url(#snowGrad)"/>

  <!-- Snow on bottom right foot -->
  <path d="M37.5 48 Q41.5 46.5 46 48 L46 49 Q42 49.5 37.5 48.8 Z" fill="url(#snowGrad)"/>

  <!-- Frost/Ice sparkle along the right slope -->
  <path d="M34 17 L44 43" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="1.5 2" opacity="0.6"/>

  <!-- CHRISTMAS SANTA CAP (Tilted comfortably on the exact apex at 32, 12) -->
  <!-- Red Velvet Cap Cone -->
  <path d="M28 14 C28 6 34 3 40 4 C45 5 48 9 47 13 C46 15 44 16 42 16 C41 14 43 11 41 8 C38 6 34 6 31 8 C29.5 9 28.5 11 28 14 Z" fill="url(#santaRed)"/>

  <!-- Fluffy White Fur Brim resting on the tip of the 'A' -->
  <path d="M26 14.5 C26 13 28 12.2 30 13 C31.5 12 33.5 12 35 12.8 C36.5 12.2 38.5 12.6 39.5 13.5 C40 14.5 39 15.5 37.5 15.8 C36 16.2 34 16 33 15.2 C31.5 16 29.5 16 28 15.2 C27 15.5 26 15.2 26 14.5 Z" fill="url(#snowGrad)" filter="url(#iceGlow)"/>

  <!-- Pom-Pom on the drooping tip -->
  <circle cx="43" cy="16.5" r="2.4" fill="url(#snowGrad)" filter="url(#iceGlow)"/>
  <circle cx="42.5" cy="15.8" r="1.2" fill="#FFFFFF"/>
</svg>