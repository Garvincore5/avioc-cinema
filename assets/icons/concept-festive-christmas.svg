<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="xmas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1430"/>
      <stop offset="50%" stop-color="#0F0C17"/>
      <stop offset="100%" stop-color="#08060E"/>
    </linearGradient>

    <radialGradient id="xmas-ambient" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F3A43B" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#E5484D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0F0C17" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="xmas-gold-light" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="35%" stop-color="#FFD15C"/>
      <stop offset="70%" stop-color="#F3A43B"/>
      <stop offset="100%" stop-color="#C97412"/>
    </linearGradient>

    <linearGradient id="xmas-gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAA236"/>
      <stop offset="50%" stop-color="#B2630E"/>
      <stop offset="100%" stop-color="#6F3905"/>
    </linearGradient>

    <!-- Santa Hat Gradients -->
    <linearGradient id="santa-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B5C"/>
      <stop offset="50%" stop-color="#D9162C"/>
      <stop offset="100%" stop-color="#8F0515"/>
    </linearGradient>

    <linearGradient id="snow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E8F1FC"/>
      <stop offset="100%" stop-color="#C5DAF5"/>
    </linearGradient>

    <linearGradient id="snow-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8DA7C9" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="xmas-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#E5484D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A2D2FF" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Play Prism Gradient -->
    <linearGradient id="xmas-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE07A"/>
      <stop offset="75%" stop-color="#FF9E1B"/>
      <stop offset="100%" stop-color="#E5484D"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="xmas-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F3A43B" flood-opacity="0.3"/>
    </filter>

    <filter id="snow-soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A0712" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#xmas-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#xmas-ambient)"/>
  <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#xmas-border)" stroke-width="2.5"/>

  <!-- Falling Snowflakes & Holiday Stars in Background -->
  <g fill="#FFFFFF" opacity="0.45">
    <circle cx="80" cy="110" r="3.5"/>
    <circle cx="430" cy="130" r="3"/>
    <circle cx="95" cy="280" r="2.5"/>
    <circle cx="440" cy="330" r="3.5"/>
    <circle cx="130" cy="420" r="2"/>
    <circle cx="390" cy="430" r="2.5"/>
    <circle cx="160" cy="70" r="2"/>
    <circle cx="350" cy="80" r="2.5"/>
  </g>
  <!-- Holiday Twinkle Stars -->
  <path d="M 90,180 Q 90,195 105,195 Q 90,195 90,210 Q 90,195 75,195 Q 90,195 90,180 Z" fill="#FFE8A3" opacity="0.6"/>
  <path d="M 425,230 Q 425,242 437,242 Q 425,242 425,254 Q 425,242 413,242 Q 425,242 425,230 Z" fill="#FFE8A3" opacity="0.55"/>

  <!-- Central Monogram & Cinema Play -->
  <g filter="url(#xmas-shadow)">
    <!-- Left Wing of 'A' -->
    <path d="M 256,128 
             L 142,398 
             L 196,398 
             L 229,310 
             L 303,310 
             L 280,258 
             L 248,258 
             L 256,232 
             Z" 
          fill="url(#xmas-gold-dark)"/>

    <!-- Left Facet Highlight -->
    <path d="M 256,128 
             L 142,398 
             L 182,398 
             L 268,175 
             Z" 
          fill="url(#xmas-gold-light)" 
          opacity="0.95"/>

    <!-- Right Wing of 'A' -->
    <path d="M 256,128 
             L 282,185 
             L 366,398 
             L 310,398 
             L 287,336 
             L 256,336 
             L 248,310 
             L 297,310 
             Z" 
          fill="url(#xmas-gold-light)"/>

    <!-- Cinema Forward Play Prism -->
    <path d="M 232,254 
             C 232,246 240,241 247,245 
             L 326,291 
             C 334,295 334,307 326,311 
             L 247,357 
             C 240,361 232,356 232,348 
             Z" 
          fill="url(#xmas-play)" 
          filter="url(#glow)"/>

    <path d="M 242,266 
             L 306,301 
             L 242,336 
             Z" 
          fill="#FFFFFF" 
          opacity="0.4"/>

    <!-- Live Ruby Broadcast Beacon -->
    <circle cx="376" cy="180" r="13" fill="#FF2E4D" filter="url(#glow)"/>
    <circle cx="376" cy="180" r="7" fill="#FFF"/>
  </g>

  <!-- Snow Accumulation Layer on the 'A' Legs and Crossbar -->
  <g filter="url(#snow-soft-shadow)">
    <!-- Snow & Icicles on Crossbar -->
    <path d="M 224,310 
             Q 235,304 246,308 
             Q 258,302 272,306 
             Q 288,303 306,310 
             L 303,316 
             Q 296,322 291,316 
             Q 282,326 276,317 
             Q 265,324 258,316 
             Q 248,322 242,316 
             Q 234,324 227,316 
             Z" 
          fill="url(#snow-grad)"/>

    <!-- Snow Mound on Left Foot -->
    <path d="M 134,398 
             Q 145,386 168,390 
             Q 186,387 198,398 
             Q 175,404 155,402 
             Z" 
          fill="url(#snow-grad)"/>

    <!-- Snow Mound on Right Foot -->
    <path d="M 306,398 
             Q 322,388 344,390 
             Q 360,387 372,398 
             Q 348,404 326,402 
             Z" 
          fill="url(#snow-grad)"/>

    <!-- Snow on Left Shoulder -->
    <path d="M 188,290 
             Q 198,280 208,285 
             Q 214,293 204,296 
             Q 194,298 188,290 
             Z" 
          fill="url(#snow-grad)"/>
  </g>

  <!-- CHRISTMAS SANTA CAP (Tilted playfully on the apex of 'A') -->
  <g filter="url(#xmas-shadow)">
    <!-- Red Cap Cone Body -->
    <!-- Arc from apex curving right and drooping down -->
    <path d="M 215,138 
             C 220,70 270,38 318,48 
             C 365,58 395,95 390,135 
             C 385,152 372,162 360,165 
             C 350,155 358,135 355,115 
             C 348,82 320,72 285,76 
             C 255,80 238,98 232,136 
             Z" 
          fill="url(#santa-red)"/>

    <!-- Velvet Fabric Fold Shadow -->
    <path d="M 270,74 
             C 305,72 338,85 348,110 
             C 342,100 320,86 285,86 
             C 265,86 248,96 240,116 
             C 245,98 256,84 270,74 
             Z" 
          fill="#59020D" 
          opacity="0.45"/>

    <!-- Fluffy White Fur Brim (Brim of Santa hat resting over the peak of 'A') -->
    <g filter="url(#snow-soft-shadow)">
      <path d="M 210,146 
               C 210,132 225,124 238,130 
               C 248,122 262,122 272,129 
               C 282,122 296,124 304,132 
               C 314,124 328,128 334,138 
               C 340,148 334,158 324,160 
               C 316,166 302,165 294,158 
               C 284,166 270,166 260,159 
               C 250,166 236,165 228,158 
               C 218,162 210,156 210,146 
               Z" 
            fill="url(#snow-grad)"/>

      <!-- Inner Fur Texture Dots -->
      <circle cx="232" cy="144" r="5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="265" cy="142" r="6" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="298" cy="145" r="5" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="322" cy="147" r="4.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- White Fluffy Pom-Pom at Drooping Tip of Cap -->
    <g filter="url(#snow-soft-shadow)">
      <circle cx="362" cy="172" r="22" fill="url(#snow-grad)"/>
      <circle cx="356" cy="166" r="14" fill="#FFFFFF"/>
      <circle cx="370" cy="178" r="6" fill="#D3E4F8" opacity="0.5"/>
    </g>
  </g>
</svg>