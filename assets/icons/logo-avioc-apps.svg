<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="app-bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#181528"/>
      <stop offset="60%" stop-color="#0c0a14"/>
      <stop offset="100%" stop-color="#050408"/>
    </radialGradient>

    <!-- Outer Prism Border Gradient -->
    <linearGradient id="prism-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a5f"/>
      <stop offset="45%" stop-color="#ffb800"/>
      <stop offset="80%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Crimson Core Gradient -->
    <linearGradient id="core-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff477e"/>
      <stop offset="50%" stop-color="#ff2a5f"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>

    <!-- Cyan Module Gradient -->
    <linearGradient id="core-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="core-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="50%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#app-bg)" stroke="url(#prism-border)" stroke-width="8"/>

  <!-- Subtle Inner Grid / Matrix Pattern -->
  <g opacity="0.12" stroke="#fff" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="256" x2="432" y2="256"/>
    <line x1="80" y1="352" x2="432" y2="352"/>
    <line x1="160" y1="80" x2="160" y2="432"/>
    <line x1="256" y1="80" x2="256" y2="432"/>
    <line x1="352" y1="80" x2="352" y2="432"/>
  </g>

  <!-- Glow Base -->
  <circle cx="256" cy="256" r="140" fill="#ff2a5f" opacity="0.22" filter="url(#glow)"/>
  <circle cx="220" cy="220" r="110" fill="#00f0ff" opacity="0.18" filter="url(#glow)"/>

  <!-- Futuristic App Matrix Icon (Isometric App Cubes) -->
  <!-- Top Left Cube: Cinema / Video Play -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#core-crimson)" filter="url(#glow)"/>
    <polygon points="42,32 74,52 42,72" fill="#ffffff"/>
  </g>

  <!-- Top Right Cube: Admin / Controls Shield -->
  <g transform="translate(268, 140)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#core-gold)"/>
    <!-- Gear / Key mark -->
    <circle cx="52" cy="46" r="16" fill="none" stroke="#120e03" stroke-width="7"/>
    <path d="M46,62 L58,62 L55,76 L49,76 Z" fill="#120e03"/>
    <circle cx="52" cy="46" r="6" fill="#120e03"/>
  </g>

  <!-- Bottom Left Cube: Downloader / Offline -->
  <g transform="translate(140, 268)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#core-cyan)"/>
    <!-- Download Arrow -->
    <path d="M52,28 L52,66 M34,50 L52,68 L70,50 M32,76 L72,76" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Right Cube: Live TV / Broadcast Signal -->
  <g transform="translate(268, 268)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="#1e1832" stroke="url(#prism-border)" stroke-width="4"/>
    <!-- Signal Waves -->
    <circle cx="52" cy="58" r="8" fill="#ffb800"/>
    <path d="M38,44 A 20 20 0 0 1 66 44" fill="none" stroke="#ff2a5f" stroke-width="5" stroke-linecap="round"/>
    <path d="M28,34 A 34 34 0 0 1 76 34" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Floating Star Badge -->
  <polygon points="256,104 263,124 284,124 267,136 273,156 256,144 239,156 245,136 228,124 249,124" fill="#ffd700" filter="url(#glow)"/>
</svg>
